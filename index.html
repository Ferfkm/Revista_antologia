<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antologia: Vozes da Psicologia - Livro Digital Aberto</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FAF5ED',
            'paper-aged': '#F2E8D8',
            'paper-dark': '#E6D7C3',
            ink: '#231F20',
            brand: {
              teal: '#2B7A78',
              coral: '#D9534F',
              gold: '#E0A96D',
              navy: '#17252A',
              yellow: '#ECC94B',
              wine: '#6B2D5C'
            }
          },
          fontFamily: {
            serif: ['Lora', 'Georgia', 'serif'],
            display: ['Cinzel', 'Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* DESIGN E ESTILOS DE LIVRO ABERTO (DOUBLE-PAGE SPREAD) */
    body {
      background: radial-gradient(circle at center, #1e2631 0%, #0c0f14 100%);
      min-height: 100vh;
      color: #2D3748;
      overflow-x: hidden;
      user-select: none;
    }

    #app-body {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }

    #book-content,
    .page-body-content {
      min-height: 0;
    }

    .page-body-content {
      overflow: hidden;
    }

    .page-footer {
      flex-shrink: 0;
    }

    /* Container 3D do Livro Aberto */
    .book-viewport {
      perspective: 2500px;
      perspective-origin: 50% 50%;
      height: 100%;
      min-height: 0;
      max-height: 100%;
    }


    /* O Livro Aberto com duas páginas lado a lado */
    .open-book {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      background-color: #FAF5ED;
      border-radius: 8px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(0, 0, 0, 0.5),
        inset 0 0 2px rgba(255, 255, 255, 0.5);
      overflow: hidden;
      transition: transform 0.4s ease;
    }

    /* Página Esquerda */
    .book-page-left {
      width: 50%;
      height: 100%;
      background-color: #FAF5ED;
      background-image: radial-gradient(#e2d7c5 0.5px, transparent 0.5px);
      background-size: 20px 20px;
      box-shadow: inset -18px 0 25px -10px rgba(0, 0, 0, 0.18);
      border-right: 1px solid rgba(0, 0, 0, 0.08);
      overflow: hidden;
      position: relative;
    }

    /* Página Direita */
    .book-page-right {
      width: 50%;
      height: 100%;
      background-color: #FAF5ED;
      background-image: radial-gradient(#e2d7c5 0.5px, transparent 0.5px);
      background-size: 20px 20px;
      box-shadow: inset 18px 0 25px -10px rgba(0, 0, 0, 0.18);
      border-left: 1px solid rgba(0, 0, 0, 0.08);
      overflow: hidden;
      position: relative;
    }

    /* Lombada central do livro */
    .book-spine-center {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 30px;
      transform: translateX(-50%);
      background: linear-gradient(to right, 
        rgba(0, 0, 0, 0.25) 0%, 
        rgba(0, 0, 0, 0.08) 35%, 
        rgba(255, 255, 255, 0.1) 50%, 
        rgba(0, 0, 0, 0.08) 65%, 
        rgba(0, 0, 0, 0.25) 100%);
      pointer-events: none;
      z-index: 30;
    }

    /* Animação suave ao trocar de espalhamento/página */
    .page-turn-anim-next {
      animation: flipNext 0.5s ease-in-out;
    }

    .page-turn-anim-prev {
      animation: flipPrev 0.5s ease-in-out;
    }

    @keyframes flipNext {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(0.98) rotateY(-2deg); opacity: 0.95; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes flipPrev {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(0.98) rotateY(2deg); opacity: 0.95; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Modos de Acessibilidade */
    .high-contrast {
      background-color: #000000 !important;
      color: #FFFF00 !important;
    }
    
    .high-contrast .book-page-left,
    .high-contrast .book-page-right,
    .high-contrast .open-book {
      background-color: #000000 !important;
      background-image: none !important;
      color: #FFFFFF !important;
      border: 2px solid #555;
    }

    .high-contrast p, .high-contrast h1, .high-contrast h2, .high-contrast h3, .high-contrast span {
      color: #FFFFFF !important;
    }

    /* Textured Cover Typography */
    .cover-title-vozes {
      color: #2B7A78;
      text-shadow: 2px 2px 0px #17252A, -1px -1px 0px #FAF5ED;
    }
    .cover-title-da {
      color: #D9534F;
      text-shadow: 2px 2px 0px #742A2A;
    }
    .cover-title-psicologia {
      background: linear-gradient(45deg, #2B7A78, #D9534F, #E0A96D, #17252A, #6B2D5C);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.3));
    }

    /* Ajuste para mobile (Página única quando a tela for muito pequena) */
    @media (max-width: 768px) {
      .open-book {
        flex-direction: column;
      }
      .book-page-left, .book-page-right {
        width: 100%;
        height: 100%;
      }
      .book-page-left,
      .book-page-right {
        display: none !important;
      }
      .book-page-left.active-mobile {
        display: flex !important;
      }
      .book-page-right.active-mobile {
        display: flex !important;
      }
      .book-page-left.active-mobile,
      .book-page-right.active-mobile {
        overflow: hidden;
      }
      .page-body-content {
        overflow: hidden;
      }
      .book-spine-center {
        display: none;
      }
    }

    /* Estilos para Impressão / PDF */
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      #app-body {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      header, nav, #accessibility-bar, #control-dock, #sidebar-toc, .book-spine-center, button {
        display: none !important;
      }
      .book-viewport, .open-book {
        box-shadow: none !important;
        width: 100% !important;
        height: auto !important;
        display: block !important;
      }
      .book-page-left, .book-page-right {
        width: 100% !important;
        display: block !important;
        page-break-after: always;
        height: auto !important;
        overflow: visible !important;
        background: white !important;
        box-shadow: none !important;
        border: none !important;
        padding: 2rem !important;
      }
    }
  </style>
</head>

<body class="font-sans antialiased text-ink flex flex-col min-h-screen justify-between" id="app-body">

  <!-- BARRA DE ACESSIBILIDADE SUPERIOR -->
  <div id="accessibility-bar" class="bg-gray-950 text-gray-300 text-xs py-1.5 px-4 flex justify-between items-center z-50 border-b border-gray-800">
    <div class="flex items-center space-x-3">
      <a href="#book-content" class="sr-only focus:not-sr-only focus:bg-amber-400 focus:text-gray-950 focus:px-2 focus:py-1 focus:rounded font-bold">Pular para o conteúdo do livro</a>
      <span class="hidden sm:inline" id="accessibility-instructions">📖 Modo Livro Aberto: Use as setas ⬅️ ➡️ do teclado para virar as páginas.</span>
    </div>
    
    <div class="flex items-center space-x-4">
      <!-- Botão de Alto Contraste -->
      <button id="btn-contrast" onclick="toggleHighContrast()" aria-label="Alternar Modo de Alto Contraste" class="hover:text-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400 px-2 py-0.5 rounded flex items-center gap-1.5 transition">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 14a6 6 0 010-12v12z"/></svg>
        <span>Alto Contraste</span>
      </button>

      <!-- Redimensionador de Fonte -->
      <div class="flex items-center space-x-1 border-l border-gray-800 pl-3">
        <button onclick="changeFontSize(-1)" aria-label="Diminuir fonte" class="px-2 py-0.5 hover:bg-gray-800 rounded font-bold hover:text-amber-300">A-</button>
        <button onclick="changeFontSize(1)" aria-label="Aumentar fonte" class="px-2 py-0.5 hover:bg-gray-800 rounded font-bold hover:text-amber-300">A+</button>
      </div>
    </div>
  </div>

  <!-- NAVBAR PRINCIPAL -->
  <header class="bg-gray-900/95 backdrop-blur-md text-white sticky top-0 z-40 shadow-xl border-b border-gray-800 shrink-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo e Botão do Sumário -->
      <div class="flex items-center space-x-3">
        <button onclick="toggleTOC()" class="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 focus:ring-2 focus:ring-amber-400 focus:outline-none transition text-amber-400 flex items-center gap-2" aria-label="Abrir Sumário e Capítulos" title="Sumário de Capítulos">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
          <span class="text-xs font-semibold text-gray-200 hidden md:inline">Sumário</span>
        </button>
        <div>
          <h1 class="font-display font-bold text-base sm:text-lg text-amber-100 tracking-wider leading-none">VOZES DA PSICOLOGIA</h1>
          <p class="text-xs text-amber-400/80 hidden sm:block font-serif">Livro Digital — Edição Unopar Cascavel</p>
        </div>
      </div>

      <!-- PAINEL DE LEITURA EM ÁUDIO (TEXT-TO-SPEECH) -->
      <div class="flex items-center space-x-2 bg-gray-950/90 rounded-full px-3 py-1.5 border border-gray-800 shadow-inner">
        <button id="btn-tts-play" onclick="toggleTTS()" class="p-2 rounded-full bg-amber-500 text-gray-950 hover:bg-amber-400 focus:ring-2 focus:ring-amber-300 focus:outline-none transition font-semibold flex items-center justify-center shadow" aria-label="Ouvir leitura em áudio das duas páginas abertas" title="Ouvir Páginas Abertas">
          <svg id="icon-play" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button onclick="stopTTS()" class="p-1.5 text-gray-400 hover:text-white rounded-full focus:outline-none" aria-label="Parar Leitura em Áudio" title="Parar Áudio">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>

        <div class="hidden lg:flex items-center space-x-1 pl-2 border-l border-gray-800 text-xs">
          <label for="tts-speed" class="text-gray-400">Velocidade:</label>
          <select id="tts-speed" onchange="updateTTSSpeed(this.value)" class="bg-gray-900 text-amber-300 rounded px-1.5 py-0.5 border border-gray-700 text-xs focus:outline-none">
            <option value="0.8">0.8x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.2">1.2x</option>
            <option value="1.5">1.5x</option>
          </select>
        </div>
        
        <span id="tts-status" class="text-xs text-amber-300 font-medium px-2 hidden sm:inline" aria-live="polite">Ouvir Páginas</span>
      </div>

      <!-- BOTÃO DOWNLOAD PDF -->
      <div class="flex items-center space-x-2">
        <a href="Pre%CC%81via%20antologia.pdf" download="Prévia antologia.pdf" class="flex items-center gap-2 bg-brand-teal hover:bg-teal-600 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition shadow focus:ring-2 focus:ring-teal-300 focus:outline-none" aria-label="Baixar arquivo Prévia antologia em PDF">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span class="hidden sm:inline">Baixar PDF</span>
        </a>
      </div>

    </div>
  </header>

  <!-- SIDEBAR - MENU SUMÁRIO -->
  <aside id="sidebar-toc" class="fixed inset-y-0 left-0 w-80 sm:w-96 bg-gray-950 text-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl flex flex-col border-r border-gray-800" aria-label="Navegação do Sumário">
    <div class="p-5 border-b border-gray-800 flex justify-between items-center bg-gray-900">
      <div>
        <h2 class="font-display text-lg text-amber-300 font-bold">Sumário Completo</h2>
        <p class="text-xs text-gray-400">Clique para abrir o capítulo no livro</p>
      </div>
      <button onclick="toggleTOC()" class="text-gray-400 hover:text-white p-1 rounded-lg focus:ring-2 focus:ring-amber-400" aria-label="Fechar Sumário">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-2 text-sm" id="toc-list">
      <!-- Preenchido dinamicamente pelo JavaScript -->
    </div>
  </aside>
  <div id="toc-overlay" onclick="toggleTOC()" class="fixed inset-0 bg-black/70 z-40 hidden backdrop-blur-sm"></div>

  <!-- CONTAINER DO LIVRO ABERTO (APROVEITAMENTO MÁXIMO DA TELA) -->
  <main id="book-content" class="flex-1 min-h-0 flex items-center justify-center p-2 sm:p-4 lg:p-6 relative">
    
    <!-- Botão Virar para Trás -->
    <button onclick="prevSpread()" class="hidden sm:flex absolute left-2 lg:left-6 z-30 p-4 rounded-full bg-gray-900/85 hover:bg-amber-500 text-white hover:text-gray-950 shadow-2xl transition transform hover:scale-110 focus:ring-2 focus:ring-amber-400 focus:outline-none border border-gray-700" aria-label="Páginas Anteriores">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
    </button>

    <!-- ESTRUTURA DO LIVRO ABERTO (DUAS PÁGINAS LADO A LADO) -->
    <div class="book-viewport w-[96vw] max-w-7xl max-h-[900px] flex justify-center items-center">
      <div id="open-book-container" class="open-book">
        
        <!-- PÁGINA ESQUERDA DO LIVRO ABERTO -->
        <article class="book-page-left p-4 sm:p-6 lg:p-8 flex flex-col justify-between" id="left-page-container">
          <!-- Conteúdo Injetado JS -->
        </article>

        <!-- LOMBADA CENTRAL DO LIVRO (SPINE) -->
        <div class="book-spine-center"></div>

        <!-- PÁGINA DIREITA DO LIVRO ABERTO -->
        <article class="book-page-right p-4 sm:p-6 lg:p-8 flex flex-col justify-between" id="right-page-container">
          <!-- Conteúdo Injetado JS -->
        </article>

      </div>
    </div>

    <!-- Botão Virar para Frente -->
    <button onclick="nextSpread()" class="hidden sm:flex absolute right-2 lg:right-6 z-30 p-4 rounded-full bg-gray-900/85 hover:bg-amber-500 text-white hover:text-gray-950 shadow-2xl transition transform hover:scale-110 focus:ring-2 focus:ring-amber-400 focus:outline-none border border-gray-700" aria-label="Próximas Páginas">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
    </button>

  </main>

  <!-- PAINEL INFERIOR DE NAVEGAÇÃO E PROGRESSO -->
  <footer id="control-dock" class="bg-gray-950/95 border-t border-gray-800 text-white px-4 py-3 sticky bottom-0 z-40 backdrop-blur-md shrink-0">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <!-- Controles Mobile / Páginas Abertas -->
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
        <button onclick="prevSpread()" class="sm:hidden px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-amber-300 text-sm font-medium border border-gray-700">
          ‹ Anterior
        </button>

        <div class="flex items-center space-x-2">
          <span class="text-xs text-gray-400" id="pages-label">Páginas</span>
          <span id="open-pages-label" class="bg-gray-900 text-amber-300 font-bold px-2 py-0.5 rounded text-sm border border-gray-700">1 - 2</span>
          <span class="text-xs text-gray-400" id="total-pages-label">de 74</span>
        </div>

        <button onclick="nextSpread()" class="sm:hidden px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-amber-300 text-sm font-medium border border-gray-700">
          Próxima ›
        </button>
      </div>

      <!-- Slider de Progresso no Livro -->
      <div class="w-full sm:flex-1 sm:mx-6 flex items-center space-x-3">
        <input type="range" id="spread-slider" min="1" max="37" value="1" oninput="jumpToSpread(this.value)" class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-amber-400 border border-gray-700" aria-label="Progresso de leitura do livro aberto">
      </div>

      <!-- Capítulo Atual -->
      <div class="text-xs text-amber-200/90 font-medium truncate max-w-sm hidden md:block" id="current-spread-title">
        Capa & Ficha Técnica
      </div>

    </div>
  </footer>

  <!-- MOTOR JAVASCRIPT DO LIVRO ABERTO -->
  <script>
    /* ==========================================================================
       1. CONTEÚDO INTEGRAL DAS PÁGINAS DO LIVRO
       ========================================================================== */
    const rawPages = [
      
      // PÁGINA 1: CAPA FIEL À ILUSTRAÇÃO ENVIADA
      {
        type: 'cover',
        title: 'Capa Frontal',
        html: `
          <div class="h-full w-full flex items-center justify-center overflow-hidden rounded-lg bg-[#F3E9D9] border-4 border-[#E2D4BF] shadow-inner">
            <img
              src="capa.png"
              alt="Capa da antologia Vozes da Psicologia"
              class="w-full h-full object-contain rounded-md"
              onerror="this.onerror=null; this.src='https://placehold.co/900x1200/efe7d7/4a3b2a?text=Capa';"
            />
          </div>
        `
      },

      // PÁGINA 2: FICHA TÉCNICA
      {
        type: 'credits',
        title: 'Ficha Técnica',
        html: `
          <div class="h-full flex flex-col justify-between font-serif text-gray-800">
            <div>
              <div class="text-center mb-6 border-b border-gray-300 pb-3">
                <h2 class="font-display text-lg font-bold text-brand-wine">ANTOLOGIA</h2>
                <h3 class="font-display text-2xl font-extrabold text-brand-teal">VOZES DA PSICOLOGIA</h3>
              </div>

              <div class="space-y-5 text-xs sm:text-sm leading-relaxed">
                <div>
                  <h4 class="font-bold text-[11px] uppercase tracking-wider text-gray-500 font-sans">Organização</h4>
                  <p class="text-base font-semibold text-gray-950">Laerte Bach</p>
                </div>

                <div>
                  <h4 class="font-bold text-[11px] uppercase tracking-wider text-gray-500 font-sans">Instituição</h4>
                  <p class="text-gray-900">Unopar Cascavel — Curso de Psicologia</p>
                </div>

                <div>
                  <h4 class="font-bold text-[11px] uppercase tracking-wider text-gray-500 font-sans">Capa e Ilustrações</h4>
                  <p class="text-gray-900">Fernanda Franciele Krasota Machado Fernandes</p>
                </div>

                <div class="p-3 bg-amber-50/90 rounded border border-amber-200 text-xs text-gray-700 space-y-1">
                  <p><strong>Nota:</strong> Os textos assinados nesta antologia expressam as vivências e opiniões de seus respectivos autores.</p>
                  <p><strong>Cascavel, Paraná — 2026.</strong></p>
                </div>
              </div>
            </div>

            <div class="text-center text-[11px] text-gray-500 font-sans border-t border-gray-200 pt-3">
              Edição Digital em Formato Livro Aberto com Acessibilidade em Áudio
            </div>
          </div>
        `
      },

      // PÁGINA 3: INTRODUÇÃO
      {
        type: 'content',
        chapter: 'Introdução',
        author: 'Laerte Bach',
        html: `
          <div class="space-y-4 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <h2 class="font-display text-xl sm:text-2xl font-bold text-brand-teal mb-3 pb-2 border-b border-teal-100">INTRODUÇÃO</h2>
            
            <p>Quando pensei nesta antologia, meu objetivo era proporcionar aos alunos de Psicologia a experiência de ver um livro com o próprio nome. Por já ter vivido isso em outras antologias, sei o quanto a escrita muda a relação de alguém com os estudos e dá ânimo para continuar produzindo e aprendendo.</p>
            
            <p>São textos opinativos, escritos por quem está vivendo a Psicologia por dentro, e cada autor foi livre para escolher o tema e o jeito de contar, sem as regras de um artigo científico. Isso acabou mostrando uma Psicologia bem mais diversa do que a que aparece em artigos. Os capítulos foram escritos para alunos de Psicologia e para quem mais tiver curiosidade sobre a profissão.</p>

            <p>Na clínica, aprendi que quem escuta também carrega as próprias perguntas. Ler estes textos me lembrou disso várias vezes, porque, por trás de cada estudante que está se preparando para cuidar do outro, existe alguém com dúvidas sobre si, tentando entender a própria história enquanto aprende a acolher a dor de outras pessoas.</p>

            <div class="pt-4 mt-4 border-t border-gray-200 text-right font-sans">

              <p class="text-[11px] text-gray-500">Organizador da Obra</p>
            </div>

        `

      // CAPÍTULO 1 - AMANDA LIMA CARDOSO DA LUZ (PÁGINAS 5 - 10)
      {
        type: 'content',
        chapter: 'O que faz a Psicologia ser tão única?',
        author: 'Amanda Lima Cardoso da Luz',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-teal">Capítulo 1</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">O QUE FAZ A PSICOLOGIA SER TÃO ÚNICA?</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Amanda Lima Cardoso da Luz</p>

            <p>Quando vemos uma pergunta como essa, a primeira coisa que vem à nossa cabeça são os testes psicológicos, a ética, as teorias, as diferentes abordagens ou a responsabilidade que existe por trás da profissão. E, de fato, tudo isso faz parte da Psicologia. Mas será que é isso que realmente a torna especial?</p>

            <p>Antes de entrar na graduação, a Psicologia era, aos meus olhos com quinze anos, um sonho. Eu imaginava uma profissão voltada para o aconselhamento, para ouvir pessoas e ajudá-las a encontrar respostas para aquilo que, sozinhas, não conseguissem compreender. Naquela época, inclusive, meu maior objetivo era trabalhar com psicoterapia de casal. Eu tinha uma ideia interessante sobre a profissão, mas ainda muito limitada.</p>

            <p>Foi justamente nesse período, aos quinze anos, que comecei a fazer terapia. Ser paciente mudou a forma como eu enxergava a Psicologia. Pela primeira vez, deixei de imaginar a profissão apenas de fora e passei a conhecê-la de outro lugar: o lugar de quem chega com dúvidas, sentimentos, dificuldades e, muitas vezes, sem saber exatamente como explicar aquilo que está vivendo.</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'O que faz a Psicologia ser tão única?',
        author: 'Amanda Lima Cardoso da Luz',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>Quando cheguei à primeira sessão, não sabia como funcionava. Estava extremamente nervosa: não sabia se era só sentar, muito menos o que falar. Foi uma experiência um tanto estranha, até eu começar a perceber que a terapia me trazia bons resultados, me ajudava a me desenvolver como pessoa e, principalmente, a entender onde queria chegar. Naquela época, o contato como paciente não me ajudou apenas a cuidar da minha saúde psicológica e emocional, que estavam muito abaladas; também me permitiu reencontrar a Amanda que agora está tirando mais um sonho do papel.</p>

            <p>Tudo isso me levou a pesquisar, ler livros, conhecer teorias e descobrir diferentes abordagens. Compreendi que a Psicologia não oferecia apenas uma maneira de olhar para o ser humano: existiam diferentes formas de compreender comportamentos, emoções, relações e experiências. Quanto mais eu estudava, mais percebia que aquilo que imaginava ser uma profissão simples de “aconselhar pessoas” carregava uma enorme responsabilidade.</p>

            <p>Hoje vejo que foi aí que a Psicologia começou a se tornar ainda mais especial para mim. Mas, aos dezessete anos, comecei a questionar se ela realmente combinava comigo. Por mais que aquele sonho continuasse existindo, havia coisas com as quais eu ainda não sabia lidar, principalmente com as minhas próprias emoções. Foi nessa época que ouvi uma frase que, de certa forma, ficou marcada em mim:</p>

            <blockquote class="p-3 border-l-4 border-brand-teal bg-teal-50/60 italic text-gray-800 text-xs rounded-r">
              "Como pode existir um psicólogo sem psicológico?"
            </blockquote>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'O que faz a Psicologia ser tão única?',
        author: 'Amanda Lima Cardoso da Luz',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>Pessoas próximas disseram essa frase numa conversa cotidiana, em tom de brincadeira, mas ela me fez questionar. Elas não sabiam — e nem eu mesma sabia — o quanto aquelas palavras me fariam pensar e se tornariam meu impulso inicial. Por outro lado, comecei a acreditar que talvez não fosse capaz; que a Psicologia pudesse ser mesmo meu sonho, mas não necessariamente o meu caminho. Então, iniciei outro curso, mas bastou o primeiro dia para perceber que não era o que eu queria.</p>

            <p>No dia seguinte, voltei atrás e busquei o curso de Psicologia, mas com a certeza de que precisava descobrir se aquele sonho realmente era meu. E aqui estou eu: aos vinte e um anos, quase concluindo a graduação, olhando para trás e percebendo que aquela menina de quinze anos tinha uma visão muito limitada da profissão que um dia desejou exercer.</p>

            <p>Hoje, se pudesse voltar à época em que me disseram essa frase, agradeceria pelo impulso que me ajudou a descobrir o que realmente quero fazer da minha vida. Talvez não seja na clínica, pois ainda estou me descobrindo. Foi neste semestre que tive meu primeiro contato com a clínica e, de qualquer forma, essa experiência me permitiu conhecer melhor esse mundo interessante que se chama Psicologia.</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'O que faz a Psicologia ser tão única?',
        author: 'Amanda Lima Cardoso da Luz',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>Essa Psicologia é, antes de tudo, uma forma de olhar para o ser humano. Um olhar que exige, além de empatia, conhecimento científico — para não se basear apenas numa relação de amizade —, ética, responsabilidade, escuta e, principalmente, respeito pelas diferenças entre as pessoas. É compreender que duas pessoas podem passar por situações semelhantes e vivenciá-las de maneiras completamente diferentes.</p>

            <p>E é isso que, aos meus olhos, torna a Psicologia tão única: estudamos o comportamento humano enquanto também somos seres humanos. Aprendemos sobre emoções enquanto sentimos as nossas, estudamos relações enquanto construímos as nossas. Aprendemos sobre sofrimento, desenvolvimento, personalidade, aprendizagem e tantos outros fenômenos enquanto também estamos vivendo nossas próprias experiências.</p>

            <p>Isso não significa que um psicólogo precise ser perfeito, ter todas as respostas ou nunca enfrentar as próprias dificuldades. Mas reconhecer a própria humanidade talvez seja uma das coisas que nos permitem compreender a dimensão da responsabilidade de cuidar do outro enquanto ser humano.</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'O que faz a Psicologia ser tão única?',
        author: 'Amanda Lima Cardoso da Luz',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>A Psicologia me ensinou que não precisamos estar cheios de certezas para escolher essa profissão. Precisamos estar dispostos a aprender continuamente. Hoje, quando penso em mim aos quinze anos, sonhando em trabalhar com psicoterapia de casal sem sequer compreender a dimensão da profissão que estava escolhendo, sinto que não estava errada; apenas ainda não conhecia o tamanho do sonho que tinha.</p>

            <p>Quero continuar conhecendo a mim mesma, o outro e tudo aquilo que ainda existe para aprender. A Psicologia é única justamente porque nunca termina: existe sempre uma nova pergunta, uma nova história e uma nova pessoa que nos trazem novas possibilidades de compreender aquilo que até então parecia incompreensível.</p>

            <div class="pt-4 text-center text-[11px] text-gray-400 font-sans border-t border-gray-200">
              Fim do Capítulo 1
            </div>
          </div>
        `
      },

      // CAPÍTULO 2 - MARIA LUIZA RIBEIRO DOS SANTOS (PÁGINAS 10 - 15)
      {
        type: 'content',
        chapter: 'Coragem para ficar',
        author: 'Maria Luiza Ribeiro dos Santos',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-coral">Capítulo 2</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">CORAGEM PARA FICAR</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Maria Luiza Ribeiro dos Santos (<a href="mailto:Luizasantossl17@gmail.com" class="underline">Luizasantossl17@gmail.com</a>)</p>

            <p>Você se considera uma pessoa corajosa? Eu, particularmente, me identifico com uma frase da autoria de Tati Bernardi que diz: “Tenho medos bobos e coragens absurdas”. Acredita que eu pego um sapo na mão, porém morro de medo de lagartas? Quando digo “morro”, não é exagero. Só de lembrar, já me arrepiei toda.</p>

            <p>E sabe o que mais? Hoje mesmo eu poderia arrumar as malas e ir para qualquer lugar do mundo sozinha. Em contrapartida, não tenho um pingo de coragem para tirar um tempo e olhar para dentro de mim, reconhecer minhas limitações, corrigir algumas coisas e permitir que algumas feridas se curem.</p>

            <p>Não vejo problema algum em querer conhecer a Torre Eiffel ou explorar os lugares mais distantes do mundo. Mas não te soa estranho ser uma eterna moradora de si mesma e, ainda assim, ser estranha na própria casa?</p>

            <p>Por muito tempo, corri de mim mesma como se isso fosse possível, mas, para onde quer que eu fosse, eu estava lá. Sempre que percebia algum desconforto ou alguém pontuava algo a meu respeito, eu ignorava e seguia em frente. Muitas pessoas ao meu redor comentavam com frequência sobre a minha dificuldade de comunicação em determinados ambientes e sobre como eu precisava melhorar minha socialização. Mas nunca considerei necessário melhorar nenhum desses aspectos. Até que comecei a fazer faculdade e vi o meu mundo cair.</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'Coragem para ficar',
        author: 'Maria Luiza Ribeiro dos Santos',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>No primeiro dia de aula, começaram as apresentações, e a professora pediu que disséssemos por que tínhamos escolhido o curso de Psicologia. Conforme todos iam se apresentando e chegava a minha vez, eu tremia, minhas mãos suavam e eu torcia para que, por algum motivo, a minha vez fosse pulada. Repassei a resposta várias vezes na cabeça para não errar na hora e não gaguejar. No fim, a única coisa que falei corretamente foi meu nome e minha idade. E eu queria, por tudo, sumir dali.</p>

            <p>Apesar disso, continuei indo às aulas. A semana foi passando, e eu observava como a dinâmica da sala era totalmente diferente de todas as outras de que já havia participado. Os alunos participavam bastante, e eu não conseguia acompanhar. Eles se mostravam desenvoltos, com facilidade para expor suas dúvidas e questionamentos. Acabei me sentindo inferior a eles e menos capaz.</p>

            <p>Uma de nossas professoras gosta muito de dinamizar as aulas, e os métodos dela são ótimos. Em uma delas, organizou a turma em roda para irmos nos acostumando a ficar cara a cara com o paciente no <em>setting</em> terapêutico. Para mim, era o equivalente à roda da morte. A cada pergunta que a professora direcionava à turma, meu coração ia à boca e voltava. Tinha medo de que me pedisse para responder e eu não conseguisse, ou de simplesmente dizer que não sabia a resposta e ser vista como burra pelos demais.</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'Coragem para ficar',
        author: 'Maria Luiza Ribeiro dos Santos',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>Diante de tudo o que vivi naquela semana, tive uma crise. Questionei a escolha do curso e se ao menos deveria ter começado a fazer faculdade. Quis parar, convencida de que aquilo não era para mim. Nos dias seguintes, não fui às aulas; decidi ficar em casa. Alguns dias depois, retornei, mas não gostei de todo o desconforto que aquele ambiente me proporcionava e voltei a ficar em casa. Chegou a semana de provas, e faltei. Não fiz nenhuma das avaliações. Para mim, era só mais um momento de ser medida, pesada e avaliada.</p>

            <p>Ao olhar para trás, reconheço a legitimidade de tudo o que senti: o medo, a sensação de inferioridade, a ansiedade e todas as dúvidas que me envolveram. Mas também reconheço um padrão que me acompanha há todos esses anos: a fuga. Quando tudo se torna desconfortável demais, quando me sinto vulnerável demais, quando toda aquela imagem de grandeza que venho pintando é ameaçada, minha primeira reação é fugir. Porque ficar implicaria admitir que não dei conta, e isso vai contra toda a versão da menina que resolve tudo.</p>

          </div>
        `
      },
      {
        type: 'content',
        chapter: 'Coragem para ficar',
        author: 'Maria Luiza Ribeiro dos Santos',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>O escritor Robert Fisher, no livro <em>O cavaleiro preso na armadura</em>, nos apresenta um cavaleiro que fica o tempo todo vestido com sua armadura, motivado pelo desejo de ser visto como gentil e bondoso, até que fica preso a ela. Quando procura ajuda para removê-la, depara-se com o sábio Merlin, que o confronta, dizendo que ele mesmo a colocou porque tinha medo. O cavaleiro refuta a afirmação e não admite. Quem, afinal, quer admitir que tem medo?</p>

            <p>As circunstâncias que nos cercam desde a infância deixam impregnada em nós a ideia de que sentir medo é algo ruim e de que admitir que temos medo pode resultar em exclusão, julgamentos negativos e até mesmo repressão. Com o passar do tempo, vestimos armaduras para esconder nossas fragilidades e passamos a enxergá-las como algo de errado em nós.</p>

            <p>Outras armaduras surgem do desejo de manter a imagem que as pessoas construíram a nosso respeito ao longo do tempo, como a da menina ou do menino que não dá trabalho, da pessoa inteligente, boazinha ou corajosa. Então, todo o nosso esforço passa a girar em torno da manutenção dessa imagem, para não provocar frustração, rejeição ou desapontamento. Agradar diminui o risco de rejeição e, por isso, seguimos pagando esse preço.</p>

            <p>Em meio a tudo isso, esquecemos o fator humano, que, por si só, derruba qualquer possibilidade de perfeição. Ser alguém corajoso não significa estar proibido de sentir medo, assim como ser inteligente não significa ter todas as respostas. Essa dificuldade de admitir minhas próprias limitações foi um dos fatores que influenciaram minha ausência na faculdade. Eu não conseguia admitir que não sabia os assuntos apresentados em aula. E, sim, era meu primeiro contato com aquelas matérias. Eu sou inteligente: como posso ainda não saber disso?</p>

            <p>Está sendo um desafio para mim deixar este capítulo assim. Todos os dias, ao acordar, logo penso em desfazer toda essa narrativa, que me descreve em um momento de tamanha fragilidade, fracassando diante de algo que, por assim dizer, pode parecer simples. Mas insisto em deixá-lo assim, porque estou decidida a quebrar esse padrão que vem me quebrando.</p>

            <p>Desde os acontecimentos que narrei anteriormente, algumas perguntas vêm me atravessando:</p>

            <p>“Ainda te é útil fugir?”</p>

            <p>“Essa armadura que você usa para esconder suas fragilidades, seus medos, suas dúvidas, suas opiniões e seus defeitos está realmente te protegendo ou te privando de oportunidades extraordinárias?”</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'Coragem para ficar',
        author: 'Maria Luiza Ribeiro dos Santos',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>Eu poderia concluir este capítulo dizendo que encontrei a solução para a minha dificuldade de comunicação em determinados ambientes, ou que voltei para a faculdade, virei o jogo, tirei notas absurdamente boas e tudo mais. Porém, a verdade é que ainda não retornei. Não porque tenha desistido por completo, pois pretendo voltar em breve, mas porque, por ora, com o auxílio da minha terapeuta, estou olhando para dentro de mim e, aos poucos, retirando a armadura que venho carregando ao longo dos anos. Estou procurando ressignificar a forma como encaro minhas limitações.</p>

            <p>Mas encerro este capítulo com a convicção de que decidi ficar. Passei tanto tempo tentando escapar do desconforto que nunca me perguntei o que aconteceria se, em vez de fugir, eu ficasse.</p>

            <p>Ficar para reconhecer minhas limitações sem transformá-las em sentenças. Para descobrir quem existe por trás das versões que construí tentando ser aceita. Pela primeira vez, começo a compreender que não preciso continuar fugindo para descobrir quem sou. Talvez eu não precise encontrar outra casa. Talvez precise aprender a habitar a minha.</p>

            <p class="font-bold text-brand-coral text-center text-sm font-display pt-2">Ficar é também um ato de coragem.</p>
          </div>
        `
      },

      // CAPÍTULO 3 - GABRIELLY MAYZE STEINHEUSER VALERIO (PÁGINAS 16 - 21)
      {
        type: 'content',
        chapter: 'Barreiras invisíveis: Maternidade no Ensino Superior',
        author: 'Gabrielly Mayze Steinheuser Valerio',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-gold">Capítulo 3</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">BARREIRAS INVISÍVEIS: MATERNIDADE E PERMANÊNCIA NO ENSINO SUPERIOR</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Gabrielly Mayze Steinheuser Valerio (<a href="mailto:steinheuserg@gmail.com" class="underline">steinheuserg@gmail.com</a>)</p>

            <p>Escrevo este texto enquanto amamento meu filho Isaac. Talvez não exista uma imagem mais fiel da minha experiência acadêmica desde que me tornei mãe. Hoje, estudar acontece entre mamadas, despertares, trabalho, estágio e todas as outras funções que continuo desempenhando.</p>

            <p>Sempre quis ser mãe. Ao mesmo tempo, sendo filha de uma mãe solo que batalhou muito para criar a mim e ao meu irmão sem ter tido muitas oportunidades de estudo, cresci entendendo a educação como possibilidade de transformação. Levei alguns anos até me encontrar no curso de Psicologia e sentir que estava no caminho certo.</p>

            <p>Conquistei uma bolsa integral por meio do vestibular, ficando entre os melhores colocados. Isso foi decisivo para que eu pudesse estudar. Tenho orgulho dessa conquista, mas também reconheço que provavelmente nem teria iniciado uma graduação particular se precisasse pagar mensalidade.</p>

            <p>Desde o começo, eu queria aproveitar tudo o que a faculdade pudesse oferecer. Participava de atividades, congressos e palestras e imaginava que um dia também poderia ocupar esses espaços como profissional. A maternidade fazia parte dos meus planos, mas deveria vir depois da graduação, quando eu já tivesse alguma estabilidade.</p>

            <p>No terceiro ano do curso, engravidei. A gestação não havia sido planejada para aquele momento, mas continuei trabalhando, frequentando as aulas e cumprindo os compromissos de estágio. Minha condição permitiu essa continuidade. Isaac nasceu em dezembro e, dois meses depois, as aulas retornaram. Eu tinha direito ao afastamento, mas optei por voltar. Como ele estava em aleitamento materno exclusivo, eu retirava leite e o deixava com o pai durante as poucas horas em que precisava estar na faculdade.</p>

            <p>Mesmo assim, senti o peso do julgamento por deixar um bebê tão pequeno sem a mãe. Ele estava com o próprio pai. Foi quando percebi que, depois que uma mulher se torna mãe, algumas escolhas parecem precisar de justificativa.</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'Barreiras invisíveis: Maternidade no Ensino Superior',
        author: 'Gabrielly Mayze Steinheuser Valerio',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>Com o passar dos meses, pensei algumas vezes em trancar a graduação. Ao mesmo tempo, meu filho também se tornou uma razão para continuar. Sempre fui pobre e hoje vivo uma realidade melhor do que aquela em que cresci. Quero poder proporcionar a ele oportunidades que eu não tive.</p>

            <p>Enquanto escrevia este capítulo, percebi que também sentia necessidade de justificar minhas próprias condições. Tenho companheiro presente, rede de apoio e bolsa integral. Tudo isso facilitou minha permanência. Mas percebi que estava quase tentando provar que tinha o direito de dizer que foi difícil.</p>

            <p>Hoje entendo que essas duas coisas podem coexistir. Posso reconhecer as condições que me favoreceram sem apagar o esforço necessário para continuar. Posso saber que outras mães enfrentam situações muito mais difíceis sem diminuir aquilo que também foi difícil para mim.</p>

            <p>Atualmente, concilio o cuidado com meu filho, o trabalho, as disciplinas e o estágio obrigatório. Muitas vezes, termino as atividades depois que ele dorme, sabendo que acordará durante a madrugada.</p>

            <p>Foi depois da maternidade que compreendi que ter dias disponíveis no calendário não significa ter horas disponíveis para estudar. Um prazo que termina no domingo pode parecer um prazo que inclui todo o final de semana. Mas finais de semana também significam cuidar do meu filho, estar com minha família e realizar outras tarefas. Muitas vezes, a oportunidade real de estudar aparece somente depois que ele adormece.</p>

            <p>Em determinado período, atrasei algumas entregas e fui cobrada por isso. Aquilo me atingiu porque sempre fui muito comprometida. Mas a maternidade não é um compromisso que pode ser colocado em pausa quando existe uma atividade para entregar.</p>

            <p>Talvez essa seja uma das partes mais invisíveis da maternidade no contexto acadêmico. Quem recebe um trabalho entregue vê apenas o trabalho. Quem me encontra em sala vê a acadêmica. Mas, antes de eu conseguir ocupar esses lugares, existe toda uma estrutura de cuidados acontecendo: o bebê que mamou antes de eu sair, alguém que ficou com ele, a noite interrompida, o computador fechado porque ele acordou e o trabalho retomado depois. A faculdade continua acontecendo normalmente, mas eu já não chego até ela da mesma maneira.</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'Barreiras invisíveis: Maternidade no Ensino Superior',
        author: 'Gabrielly Mayze Steinheuser Valerio',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>Antes de ser mãe, eu acreditava que, se quisesse muito alguma coisa, bastava me dedicar mais. Hoje entendo que esforço não produz tempo infinito. Posso me organizar, planejar e ter disciplina. Ainda assim, meu filho pode adoecer, dormir mal ou simplesmente precisar mais de mim naquele dia.</p>

            <p>Mesmo assim, a comparação aparece. Às vezes, observo colegas vivendo aquilo que eu imaginava para esta fase: cursos, congressos, leituras e experiências profissionais. Em alguns momentos, pensei: “Eu estraguei tudo”. É difícil admitir esse pensamento porque ele parece incompatível com o amor que sinto pelo meu filho.</p>

            <p>Posso amar profundamente Isaac e, ao mesmo tempo, sentir falta da trajetória que havia imaginado para mim. A maternidade me ensinou que sentimentos contraditórios podem coexistir.</p>

            <p>Às vezes, me sinto distante da psicóloga que imaginei no início da graduação. Mas talvez eu não esteja me afastando dela; apenas construindo uma versão diferente daquela que imaginei. Hoje penso nas mulheres que atravessam a universidade sem rede de apoio, sem bolsa, sem companheiro presente ou sem condições financeiras: nas mães solo, nas mulheres que precisam trabalhar e estudar, nas que enfrentam uma gestação difícil e nas que acabam abandonando a graduação porque continuar se torna inviável.</p>

            <p>Falar sobre maternidade dentro da universidade não significa pedir privilégios. Significa reconhecer que as pessoas não partem das mesmas condições. Um prazo pode ser igual para todos. A disponibilidade para cumpri-lo, não.</p>

            <p>Espero que, quando Isaac crescer e compreender essa parte da nossa história, não enxergue a faculdade como algo que me afastou dele. Espero que compreenda que continuar também foi uma forma de cuidar: do futuro dele e do meu.</p>

            <div class="pt-4 text-center text-[11px] text-gray-400 font-sans border-t border-gray-200">
              Fim do Capítulo 3
            </div>
          </div>
        `
      },

      // CAPÍTULO 4 - FERNANDA FRANCIELE KRASOTA MACHADO FERNANDES (PÁGINAS 22 - 26)
      {
        type: 'content',
        chapter: 'A História Sem Elas',
        author: 'Fernanda Franciele Krasota Machado Fernandes',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-wine">Capítulo 4</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">A HISTÓRIA SEM ELAS: O APAGAMENTO DAS MENTES FEMININAS</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Fernanda Franciele Krasota Machado Fernandes (@fernandafkmachado)</p>

            <p>Sentada na sala de aula, percebo ao meu redor turmas majoritariamente compostas por mulheres e, à frente, uma professora. Ao olhar para a tela do projetor e abrir os livros, observo a lista de grandes nomes: Freud, Rogers, Skinner, Maslow.</p>

            <p>Há quinze anos, quando me deparei com a escrita do TCC na faculdade de Filosofia, busquei compreender como as estruturas organizam o mundo. Na época, minha atenção estava voltada a questões como indústria cultural, alienação e estruturas sociais. No entanto, já havia outra questão que me causava certo desconforto e que simplesmente deixei passar. Foram quatro anos de graduação em que raramente ouvi nomes de filósofas. Hannah Arendt e Simone de Beauvoir eram citadas apenas de passagem.</p>

            <p>O tempo passou. Hoje estou no terceiro ano da faculdade de Psicologia. A história se repete, mas, dessa vez, o desconforto e o incômodo me atravessam de um modo diferente.</p>

            <p>Foi uma sensação de <em>déjà-vu</em>, uma mistura de frustração e alerta: como é possível estar vivenciando novamente o apagamento de nomes femininos na história?</p>

            <p>A partir daqui, meu olhar se volta à escrita de mulheres — cientistas, filósofas, psicólogas. Essa inquietação me faz olhar para a própria Psicologia e perguntar: até que ponto a nossa liberdade é refém de uma história que não fomos nós que escrevemos? As estruturas sociais, acadêmicas e políticas, muitas vezes despercebidas e pouco questionadas, moldam as regras da sociedade, nossas vivências e escolhas, e o que aprendemos ou não nas escolas e universidades. Quase tudo nos é apresentado como pronto, e simplesmente aceitamos, sem questionar, sem refletir. Porém, quando olhamos com mais atenção para essas estruturas, o questionamento torna-se inevitável: como chegamos até aqui?</p>

            <p>Quando olho para a história da Psicologia e ouço falar de psicanálise, behaviorismo, humanismo, existencialismo, entre outras correntes, quais nomes aparecem? O fato é que a história da humanidade foi contada sob um único ponto de vista: o dos homens. Foram eles que ocuparam os lugares de poder, registraram os fatos e decidiram o que era importante ou o que devia ser descartado.</p>

            <p>Quantas mentes brilhantes foram esquecidas ao longo do tempo? Não por falta de capacidade ou talento, mas por um sistema feito para deixá-las de fora. Quantas vezes uma mulher fez uma descoberta incrível ao lado de um parceiro e só o nome dele foi parar na capa do livro ou entre os grandes prêmios? Isso ficou escancarado, por exemplo, quando a filósofa Simone de Beauvoir esteve no Brasil e as manchetes dos jornais diziam: “Sartre está no Brasil e trouxe Simone de Beauvoir”<sup>[1]</sup>. Ela, uma das maiores pensadoras do século, foi reduzida a uma acompanhante.</p>

            <p>A teoria dá o nome de <strong>epistemicídio</strong> a esse processo: o apagamento sistemático do saber produzido por grupos marginalizados. O mais angustiante é perceber que isso não ficou no passado. Essa construção desigual continua viva hoje, criando barreiras invisíveis que sufocam a nossa liberdade e o espaço das mulheres. A mensagem implícita para uma estudante e futura profissional é a da dependência intelectual: alimentamos a ideia de que o saber pertence aos homens e sustentamos a sensação de insuficiência.</p>
          </div>
        `
      },
      {
        type: 'content',
        chapter: 'A História Sem Elas',
        author: 'Fernanda Franciele Krasota Machado Fernandes',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <p>Como explicar que uma profissão mantida por mulheres continue ensinando uma história contada quase só por homens? A ironia é que a base do cuidado humano sempre passou pelas mãos e mentes femininas. Pensadoras como Edith Stein, ao falar de empatia; Simone de Beauvoir, ao pensar a liberdade; Laura Perls, ao resgatar o corpo na terapia; e Charlotte Bühler, ao estudar o sentido da vida, criaram bases sem as quais a Psicologia hoje seria fria e distante. Nise da Silveira, ao revolucionar a psiquiatria no Brasil, me emociona por sua coragem: enfrentou os métodos psiquiátricos violentos de sua época e transformou o tratamento em saúde mental por meio do afeto e da arte.</p>

            <p>Contudo, nesses três anos de graduação, lembro-me de sua obra ter sido abordada apenas na exibição do filme <em>Nise: O Coração da Loucura</em>. É sintomático perceber como uma mulher que transformou a história da Psicologia no país acaba sendo reduzida a um evento.</p>

            <p>É preciso repensar os currículos e as grades que formam psicólogas todos os anos, incluindo autoras, pesquisadoras e pensadoras brasileiras e resgatando o princípio de identidade na construção de saberes. Um exemplo é Virginia Leone Bicudo, uma das primeiras psicanalistas do Brasil: mulher negra, socióloga e pioneira ao investigar como as marcas do preconceito, do racismo estrutural e das desigualdades sociais atravessam diretamente a saúde mental e a formação da nossa subjetividade. Ensinar Psicologia nas universidades sem citar autoras como Nise ou Virginia é seguir um roteiro já estruturado nessa escala patriarcal, perpetuando a ideia de que a ciência é feita apenas no exterior por homens europeus. O trabalho dessas pensadoras não foi um “complemento” à Psicologia: elas fundaram perspectivas essenciais para compreendermos quem somos e como nos constituímos enquanto sujeitos.</p>

            <p>É inegável que avançamos. As mulheres deixaram de ser apenas “objetos de estudo”, frequentemente rotuladas no passado como “histéricas”, para se tornarem líderes de pesquisas e criadoras de conhecimento. Mas só ter mulheres ocupando esses espaços não basta. É preciso reescrever os livros e transformar o que é ensinado. Resgatar essas pensadoras é, sobretudo, uma questão de justiça e de reparação histórica. A humanidade só chegou até aqui porque as mulheres também lideraram a caminhada: mesmo que não sejam citadas nos manuais, elas estavam lá, produzindo, escrevendo e transformando a história.</p>

            <p>Está mais do que na hora de a história oficial reconhecer isso. A valorização vai muito além da presença física de mulheres nas universidades: é essencial reescrever os currículos e reparar o apagamento histórico de suas teorias. Ao resgatar o protagonismo de pensadoras na Fenomenologia, na Psicanálise, em toda a Psicologia e em toda a ciência, busca-se instaurar a equidade e oferecer às futuras gerações o direito de saber que a inteligência, o rigor científico e o cuidado humanizado sempre foram também marcas da autoria feminina.</p>

            <p>Superar o epistemicídio é fundamental para que as futuras gerações, ao olharem para os espelhos da história, saibam que a ciência também pertence às mulheres e foi construída com seu protagonismo.</p>

            <p class="pt-2 border-t border-gray-200 text-[10px] text-gray-600"><sup>[1]</sup> A cobertura da imprensa brasileira durante a visita do casal ao país, em 1960, retratou frequentemente Simone de Beauvoir a partir de seu vínculo afetivo com Jean-Paul Sartre, referindo-se a ela de forma recorrente como acompanhante ou “esposa” e invisibilizando sua estatura como filósofa e escritora independente. Um exemplo dessa enquadração midiática pode ser observado em: JORNAL DO BRASIL. <em>Simone de Beauvoir sem Sartre</em>. Rio de Janeiro, 26 de agosto de 1960.</p>
          </div>
        `
      },

      // CAPÍTULO 5 - EMANUELLY CORREA (PÁGINA 27)
      {
        type: 'content',
        chapter: 'Ressignificar na terapia',
        author: 'Emanuelly Fernanda Correa',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-teal">Capítulo 5</span>
            <h2 class="font-display text-lg font-bold text-gray-950 leading-tight">RESSIGNIFICAR NA TERAPIA, DIANTE DA ÓTICA PSICANALISTA</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Emanuelly Fernanda Correa (emanuellycorrea@hotmail.com)</p>

            <p>Qual é o tamanho da nossa bagagem? Quanto de cada pessoa que passou por nossa vida e do mundo exterior existe dentro de nós? Cada vivência que tivemos ao longo da jornada e da convivência com outras pessoas molda uma parte da história que trilhamos e fica guardada conosco, seja boa ou ruim, ao nosso ver.</p>

            <p>Nem tudo o que carregamos é algo que queremos levar conosco. Isso gera sentimentos e, muitas vezes, não sabemos lidar com eles. Não somos apenas a nossa história: somos aquilo que desejamos ser. Mas, sem os acontecimentos, talvez não tivéssemos consciência desse desejo. Algumas coisas nos mudam tanto que deixamos de saber quem somos. A mudança é inevitável.</p>

            <p>Acredito que a história pessoal de cada pessoa seja formada pelas culturas familiares: a fé, o jeito de falar, as vestimentas, o estilo musical, aquilo em que acreditamos e o que nos ensinaram sobre o que é certo e errado, entre tantas outras coisas. Nesse processo, pode acontecer de não nos reconhecermos mais diante de tudo o que nos foi ensinado e de precisarmos desenvolver novos passos.</p>

            <p>Na ótica da psicanálise, somos formados por desejos, e muitos deles não são nossos. O modo como fomos criados e as situações que vivemos podem moldar nossas escolhas futuras. Mas isso não quer dizer que não possamos ressignificar quem somos, o que escolhemos, nossos motivos e nossos desejos.</p>

            <p>É comum ouvir que falar não ajuda e que terapia é só alguém escutando. Mas não se trata somente disso. Quando conversamos com um amigo ou uma pessoa próxima, recebemos opiniões sobre nossas decisões. Nesse diálogo, nem sempre conseguimos refletir sobre o que de fato desejamos; ao receber opiniões de fora, nossos pensamentos e atitudes podem ser moldados pelo olhar de outra pessoa. Sei bem como é isso: quando converso com outras pessoas, mudo minhas opiniões por medo de pensar diferente. Sinto que aquilo que penso não tem tanta importância diante do pensamento de outra pessoa; o meu parece menor, insignificante. Mas não deveria ser assim. As diferenças de cada um são o que tornam um assunto interessante. Ainda assim, volta aquele pensamento: faço isso por seguir passos que acompanho desde pequena e continuarei seguindo se não houver o desejo de me descobrir.</p>

            <p>Mas e quando temos um momento em que podemos falar sem receber algo de fora? Quando falamos sobre tudo o que pensamos, sentimos e sobre todas as dores; sobre momentos que simplesmente aconteceram e cujo significado nunca chegamos a pensar. Nessas falas, alguém nos escuta com atenção e carinho, e acontece o acolhimento. Na psicanálise, a palavra tem um papel fundamental. Através da fala livre (associação livre), entramos em contato com conteúdos do inconsciente que não percebemos de imediato. Aquilo que não conseguimos expressar diretamente pela linguagem muitas vezes se manifesta no corpo e nos afetos — no choro, na raiva ou no medo. A escuta terapêutica nos ajuda a dar um novo sentido a essas experiências e a compreender o impacto que causaram.</p>

            <p>Acredito que a ressignificação começa quando nasce o desejo de buscar quem sou. Digo isso pela minha própria experiência. Durante muitos anos, tive o desejo de saber quem sou, porque constantemente mudava: tinha formas diferentes de pensar e desejos diferentes. Com isso, arrisquei-me em muitas coisas novas, fiz cursos em áreas diferentes e estive em diversos ambientes de trabalho. Parecia que faltava algo, e eu procurava isso em lugares diferentes, decepcionando-me muitas vezes.</p>

            <p>Recentemente, percebi que nunca haverá algo 100% suficiente, pois essa busca sempre vai existir. A falta que eu sentia dizia sobre querer me entender completamente, me estabilizar em algo e continuar assim. Acredito que ressignificar também é entender que nem tudo depende das nossas escolhas. Existem situações que não podemos mudar, pessoas que não podemos controlar e respostas que talvez nunca teremos. Mas podemos escolher como vamos lidar com aquilo que aconteceu, sem permitir que essas experiências definam todos os nossos próximos passos. Às vezes, seguir em frente também significa aceitar que algumas coisas não terão a explicação que gostaríamos.</p>

            <p>A importância da ressignificação está em compreender que sempre podemos começar de novo. Estamos em constante mudança: novos lugares, novos sonhos, novas pessoas e novos pensamentos. Não estou aqui para dizer que basta falar para ressignificarmos. O conhecimento de tudo o que vivemos, o medo, os desejos e, principalmente, a coragem podem ser um ponto de partida para um novo começo. E digo que não é um caminho fácil: ao longo do processo, nós mesmos podemos nos impedir de seguir ou decidir fazer uma nova rota.</p>

            <p>Diante de tudo o que disse a vocês, volto a falar das bagagens, das antigas e das novas. As antigas continuam fazendo parte da nossa história. Posso olhar para elas e lembrar de cada coisa, mas também posso compreender o significado que tiveram e decidir o que desejo levar comigo. Na psicanálise, esse olhar para o passado não significa apagar o que aconteceu, mas buscar compreender como essas experiências ainda podem influenciar nossas escolhas e relações no presente. Assim, posso me recordar de quem um dia fui e reconhecer quem estou me tornando, sem precisar permanecer sendo aquilo que já não faz sentido para mim. Acho legal olhar para as antigas bagagens e entender o que ainda quero guardar e o que posso deixar de carregar.</p>

            <p>Ressignificar não se trata somente do desejo de ser alguém, mas também de pertencer a algo e de entender por que queremos pertencer àquilo. Trata-se do desejo de ser escutado e, mais importante, de cada um de nós saber escutar a si mesmo. Quando há essa escuta, podemos nos acolher e entender nossos sentimentos.</p>

            <p>Eu sempre quis pertencer a alguém, a algum lugar, mas então refleti sobre a importância de pertencer a mim mesma. Sou eu quem conhece cada gosto que tenho, quem sabe por onde quero ir e por onde fui um dia, quem sabe até onde vai o meu limite. Convivo comigo mesma a todo momento e, mesmo assim, é tão difícil saber quem sou — e mais difícil ainda me sentir pertencente a mim mesma. É como se não bastasse ter só a mim, até porque nem sei quem sou: ainda estou me descobrindo. Acredito que isso gere medo e que, por isso, esse sentimento de pertencer a algo seja difícil.</p>

            <p>Acredito que seja um processo sem fim: podemos ressignificar todos os dias, até porque estamos constantemente aprendendo coisas novas. Recordo-me de antigos gostos que me faziam bem e que hoje já não fazem. Não sinto desprezo por isso; acho legal olhar para coisas que eu fazia e perceber que outras coisas me fazem feliz agora. Vejo o quanto mudei e quanta coisa aconteceu nesse tempo, e sei que ainda há uma longa caminhada pela frente e muitas coisas podem mudar. Ainda me pergunto constantemente quem sou, mas hoje, trazendo essa reflexão a vocês, entendo que essa pergunta será feita muitas vezes. Afinal, as coisas mudam, e isso é bem legal. O que será que há de novo me aguardando por aí — ou, na verdade, nos aguardando, né?!</p>
          </div>
        `
      },

      // CAPÍTULO 6 - ANDRÉA SOUZA ARANTES (PÁGINAS 28 - 32)
      {
        type: 'content',
        chapter: 'Corpo em movimento, mente em cuidado',
        author: 'Andréa Souza Arantes',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-teal">Capítulo 6</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">CORPO EM MOVIMENTO, MENTE EM CUIDADO: A ATIVIDADE FÍSICA COMO ALIADA DA PSICOTERAPIA</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Andréa Souza Arantes (psico.andreaarantes@gmail.com)</p>

            <p>O que você tem feito por você? Essa foi a pergunta que ouvi por muito tempo na sala do meu terapeuta. Foi um período em que eu enfrentava a depressão.</p>

            <p>Eu não conseguia perceber o que se passava na minha mente, mas o meu corpo falava: havia um cansaço sem motivo, insônia e falta de motivação para me movimentar. Eu não conseguia descrever em palavras o que meu corpo estava querendo dizer. Aquele cansaço não era apenas físico: meu corpo dava sinais, como dores musculares, que também refletiam o que eu vivia emocionalmente.</p>

            <p>Isso não significa que todo sintoma físico tenha origem emocional. Convido você a olhar para si de forma mais integral, reconhecendo a relação constante entre corpo e mente.</p>

            <p>A atividade física não substitui uma sessão de psicoterapia. Durante a psicoterapia, existe o momento de fala, escuta e reflexão, no qual a pessoa pode organizar os pensamentos, compreender os sentimentos e dar significado às experiências que está vivendo. É um espaço de construção e desconstrução do autoconhecimento e do autocuidado.</p>

            <p>Quem convive com transtornos mentais pode perceber como o exercício faz parte da rotina de cuidado. Percebi isso quando realmente consegui movimentar o meu corpo.</p>

            <p>Foi vivendo essa experiência que percebi, na minha própria história, o quanto o movimento poderia fazer parte do meu cuidado. Alguns anos atrás, quando me deparei com a depressão, iniciei a psicoterapia. Em uma das conversas, meu terapeuta me fez aquela pergunta que ficou comigo: “O que você tem feito por você?”</p>

            <p>Eu nunca gostei muito de academia, mas gostava de caminhar e dançar. Então, comecei aos poucos, sem grandes cobranças. E como foi começar? Nada fácil. A procrastinação estava instalada, mas eu queria ouvir meu terapeuta dizer: “Parabéns, esse é o caminho”. Organizei-me para começar em um dia totalmente aleatório, que não fosse a tão famosa segunda-feira.</p>

            <p>A cada sessão, eu tinha mais entusiasmo. As perguntas do terapeuta eram: “Como foi a semana?” e “Como foram os treinos?”. A cada avanço, eu me sentia mais apoiada, e a vontade de vencer se tornava mais constante.</p>

            <p>Então, fiz um desafio interno: se conseguisse, teria uma recompensa, daria a mim mesma um mimo como reconhecimento do meu esforço. No início, eram quinze minutos de caminhada por semana; depois, duas vezes por semana, e assim fui aumentando. Percebi que, quando voltava das caminhadas, estava com mais ânimo, disposição e bom humor. Logo, já eram três, quatro, e cheguei a cinco vezes por semana. Não foi uma mudança que aconteceu de um dia para o outro, mas um movimento de volta para mim mesma.</p>

            <p>Lembro-me de como ele era positivo em suas falas: “Estou com você”, “Eu acredito em você”. Essas palavras de apoio, firmes e acolhedoras, me davam segurança. No fundo, eu esperava que ele me desse o aval ou me empurrasse diretamente para o exercício quando contei sobre minhas caminhadas. Mas ele fez algo muito mais profundo: mostrou-me que o mérito daquela escolha era exclusivamente meu, ajudando-me a conectar a ação prática ao meu próprio bem-estar. A partir daí, a dinâmica das nossas sessões mudou completamente. Eu já não chegava apenas para falar de pesos ou angústias; chegava diferente, com outra postura, trazendo meus avanços, compartilhando minhas pequenas conquistas a cada semana e com a certeza de que estava construindo minha própria autonomia.</p>

            <p>Posso dizer, a partir da minha própria experiência, o quanto a atividade física me fez bem. Eu sentia uma energia interna: por exemplo, fazer uma caminhada às seis horas da manhã me dava disposição para arrumar a casa e cumprir minhas obrigações. Comecei a me sentir mais forte, disposta e segura. Em uma aula de Pilates, quando consegui me equilibrar na bola, senti uma mistura de alegria e pedi para tirarem uma foto.</p>

            <p>Foi naquele momento que me senti capaz de superar não só o desafio de me equilibrar na bola, mas também de retomar o equilíbrio da minha vida. Inclusive, tenho essa foto até hoje; foi um momento de muita superação.</p>

            <p>E você pode estar se perguntando: houve constância? Foi uma receita mágica? E eu digo: não. Nos momentos de frustração, quando bate a vontade de desistir, vêm as desculpas: “Estou cansada”, “amanhã eu vou”, “está chovendo”, “está frio”. Mas sempre digo: aquilo que preciso fazer por mim, ninguém vai fazer. Até hoje, quando percebo que estou para baixo, triste ou desanimada, procuro me movimentar: faço uma caminhada, alguns polichinelos ou simplesmente coloco uma música e começo a dançar.</p>

            <p>Acho que o movimento faz isso: quando coloco o corpo para andar, algo também ganha espaço por dentro. Recuperei forças, voltei a fazer pequenas escolhas e percebi que ainda era capaz de agir por mim.</p>

            <p>O movimento do corpo pode contribuir não apenas para o bem-estar físico, mas também para aspectos emocionais. Procure algo do seu interesse, como caminhar, dançar, correr, praticar algum esporte ou simplesmente colocar o corpo em movimento. Na atividade física, encontramos também uma possibilidade de estar mais presentes no próprio corpo e perceber como ele responde a esse movimento.</p>

            <p>Os exercícios físicos foram aliados importantes nos momentos em que enfrentei o desânimo. Antes, eu tinha dificuldades para dormir, mas a rotina de atividades trouxe noites mais tranquilas e um descanso muito melhor. Movimentar o corpo também me fortaleceu emocionalmente e me ajudou a cuidar de mim de forma mais integral.</p>

            <p>No meu caso, a atividade física não apagou a dor nem substituiu a terapia, mas virou uma grande aliada: um jeito de voltar a me sentir presente na minha própria vida. E, se em algum momento você desanimar ou pensar em desistir, entenda que tudo é um processo: existem dias bons e dias desafiadores. Há quem precise de companhia, enquanto outros preferem ir sós. O importante é fazer a sua escolha e se sentir bem com o caminho que decidir seguir.</p>
          </div>
        `
      },

      // CAPÍTULO 7 - WELLEN SANTOS (PÁGINAS 33 - 38)
      {
        type: 'content',
        chapter: 'Quando nasce uma mãe, quem nasce junto?',
        author: 'Wellen Priscila Araujo Pereira dos Santos',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-wine">Capítulo 7</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">QUANDO NASCE UMA MÃE, QUEM NASCE JUNTO?</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Wellen Priscila Araujo Pereira dos Santos (@priscilawellen)</p>

            <p>Passei anos esperando pelo dia em que teria meu filho nos braços. O que eu não imaginava era que, depois desse encontro, também precisaria aprender a olhar para mim de uma nova maneira. Em que momento ser mãe se tornou tão fácil de reconhecer, enquanto reconhecer a mim mesma ficou tão difícil?</p>

            <p>Sempre sonhei com a maternidade, mas, por questões de saúde, engravidar parecia difícil. Depois de nove anos de casamento, durante uma investigação para tratar pólipos uterinos, descobri inesperadamente que estava grávida. Meu sonho finalmente acontecia.</p>

            <p>Minha gestação, porém, foi marcada por sangramentos, idas ao hospital, medo de perder meu bebê e uma cerclagem devido ao encurtamento do colo do útero. Quando Joshua nasceu, vivi uma felicidade indescritível. Meu esposo esteve ao meu lado, um apoio que reconheço como privilégio, pois nem todas as mulheres contam com essa rede.</p>

            <p>Depois de tanta espera, imaginava que o amor me prepararia para tudo. Mas desejar muito alguma coisa não significa saber como vivê-la.</p>

            <p>Uma das primeiras dificuldades foi a amamentação. O leite não veio como eu esperava. Tentei estimular a produção e busquei ajuda, inclusive no banco de leite, mas precisei alimentar meu filho com fórmula desde o nascimento. Senti frustração e culpa. Questionava minha capacidade de ser mãe e temia prejudicar nosso vínculo.</p>

            <p>Demorei a compreender que amamentar não é a única forma de demonstrar amor. O vínculo também se constrói no colo, no olhar e no cuidado cotidiano. Uma mulher não é menos mãe porque não conseguiu amamentar. A maternidade não deveria ser medida por uma única experiência.</p>

            <p>Foi assim que percebi a distância entre a maternidade idealizada e a real. Espera-se que o instinto materno apareça automaticamente, mas ser mãe também é aprender, errar, sentir medo e descobrir, dia após dia, como cuidar de alguém que depende de você.</p>

            <p>Chegam ainda conselhos não solicitados: que o leite é fraco, que o bebê precisa de chá, que colo demais acostuma mal. Mesmo bem-intencionadas, essas opiniões podem abalar a confiança de quem já enfrenta tantas mudanças. Em vez de acolhimento, encontramos cobranças para corresponder a uma mãe ideal que não existe.</p>

            <p>No puerpério, o corpo muda, o sono se fragmenta e a rotina gira em torno do bebê. Algumas mulheres vivenciam o <em>baby blues</em>; outras podem desenvolver depressão pós-parto, que exige avaliação e cuidado profissional. O sofrimento materno não deve ser minimizado.</p>

            <p>No meio de tantas mudanças, uma questão começou a me acompanhar: onde eu estava em tudo aquilo?</p>

            <p>Eu continuava sendo esposa, estudante, mulher, alguém com sonhos próprios. Mas esses papéis pareciam ficar em segundo plano. Entre fraldas, mamadeiras, choros e noites interrompidas, estava tão concentrada em cuidar que já não sabia como cuidar de mim.</p>

            <p>O mais difícil da maternidade nem sempre é cuidar do bebê, mas aprender a cuidar de si enquanto se cuida dele.</p>

            <p>Sentir falta da liberdade e de quem eu era antes não significa amar menos meu filho ou me arrepender de tê-lo. Mesmo assim, sentia culpa. Depois de tanto esperar, como poderia sentir saudade da minha antiga vida? Como poderia estar cansada de algo que desejei tanto?</p>

            <p>A comparação com imagens de maternidades perfeitas nas redes sociais pode fazer muitas mulheres acreditarem que estão falhando.</p>

            <p>A rede de apoio faz diferença. A responsabilidade pelo bebê não deve recair exclusivamente sobre a mãe. O pai não está ali apenas para ajudá-la: ele também é responsável pela criação do filho. Dividir tarefas e acolher sentimentos permite que a mulher encontre algum espaço para si.</p>

            <p>Nem todas têm esse suporte. Mães solo podem enfrentar uma sobrecarga ainda maior. As condições financeiras também pesam: recomendar academia, salão de beleza ou descanso é fácil, mas nem todas têm dinheiro ou tempo para isso.</p>

            <p>Não basta dizer que a mulher precisa se priorizar. É necessário que ela tenha condições reais de fazer isso. Reconstruir a identidade também depende de apoio, participação paterna, condições de trabalho e acesso à saúde mental.</p>

            <p>O acompanhamento psicológico pode oferecer um espaço de escuta sem julgamentos, onde a mãe reconheça suas necessidades e não precise esconder o cansaço para provar seu amor.</p>

            <p>Essa reconstrução não tem prazo. Conheci uma mãe que levou doze anos após o nascimento do primeiro filho para começar a se reencontrar. Cada trajetória tem seu tempo.</p>

            <p>Ouvi de uma psicóloga uma frase que me marcou: as coisas melhoram não necessariamente porque ficam mais fáceis, mas porque nos tornamos mais fortes. Reencontrar-me não é voltar a quem eu era, mas reconhecer que posso ser mãe e continuar tendo sonhos, sentimentos, limites e necessidades próprias.</p>

            <p>A maternidade é feita de contradições. Podemos viver uma das maiores felicidades e sentir um cansaço profundo; desejar que nossos filhos cresçam e querer guardar certas fases para sempre; estar acompanhadas e ainda sentir solidão. Podemos amar e, mesmo assim, não saber como agir. Uma coisa não anula a outra. É nesse espaço que precisamos de mais acolhimento e menos julgamento.</p>

            <p>Durante muito tempo, imaginei que a chegada do meu filho preencheria todos os espaços da minha vida. E, de certa forma, preencheu. Mas não imaginava que, ao mesmo tempo em que descobriria um amor tão grande, também sentiria falta de partes de mim que pareciam ter ficado para trás. Foi difícil compreender que esses sentimentos poderiam existir juntos, sem que um anulasse o outro.</p>

            <p>Talvez uma das maiores dificuldades da maternidade seja justamente essa: enquanto todos acompanham o crescimento do bebê, poucas pessoas percebem as transformações silenciosas que acontecem com a mulher. Todos perguntam como está o filho, se está dormindo, se está mamando, se está crescendo. Mas quantas vezes alguém pergunta como está aquela que passa os dias e as noites cuidando dele?</p>

            <p>O amor também está nas mamadeiras, nos olhares, nos sorrisos inesperados e no aconchego do meu filho. Enquanto ele aprende a viver, eu aprendo a ser sua mãe. Se um dia meu filho ler estas palavras, quero que saiba que nunca me arrependi de tê-lo. Sentir cansaço ou saudade de quem eu era não diminui o amor que sinto por você.</p>

            <p>A mãe também precisa ser cuidada, ouvida e reconhecida como pessoa. Não precisa escolher entre amar seu filho e olhar para si, nem sentir culpa por desejar descanso ou retomar sonhos.</p>

            <p>Talvez eu ainda não tenha todas as respostas, e tudo bem. Com o tempo, tenho entendido que a maternidade não precisa significar deixar minhas próprias necessidades em segundo plano.</p>

            <p>Ainda estou aprendendo a reconhecer a mulher que existe em mim depois da chegada do meu filho. Ser mãe não apagou quem eu era, mas transformou profundamente a maneira como me vejo. Entre medos, cansaço e amor, sigo encontrando espaço para mim nessa nova vida.</p>

            <p>Afinal, quando nasce uma mãe, não deixa de existir uma mulher. Nasce uma nova forma de ser mulher, e talvez uma das tarefas mais bonitas e desafiadoras dessa jornada seja aprender a reconhecê-la.</p>
          </div>
        `
      },

      // CAPÍTULO 8 - GISELE KRAVICZ (PÁGINAS 39 - 44)
      {
        type: 'content',
        chapter: 'A Representação Social do Diagnóstico',
        author: 'Gisele Ferreira Kravicz',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
