            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-gold">Capítulo 8</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">A REPRESENTAÇÃO SOCIAL DO DIAGNÓSTICO: QUEM É VOCÊ, ALÉM DO QUE DIZEM QUE VOCÊ TEM?</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Gisele Ferreira Kravicz (<a href="mailto:giselekravicz@gmail.com" class="underline">giselekravicz@gmail.com</a>)</p>

            <p>“Ele é autista e tem altas habilidades”, “o meu tem TDAH e TOD”. São algumas das frases que ouvi enquanto aguardava na sala de espera de uma clínica.</p>

            <p>Vivemos em tempos em que os diagnósticos também passam constantemente por um processo de coisificação. Parece que o enquadramento em determinado transtorno, comorbidade ou até mesmo neurodivergência passa a ser uma forma de explicar quem é o sujeito. Entretanto, compreendo que, para além das características que esse sujeito apresenta, existe uma necessidade social de enquadramento como critério para estabelecer distinções. Por isso, falas como “ele é autista”, “ele é narcisista” e “ela tem dislexia” permeiam a sociedade como forma de classificar e dar sentido àquilo que parece desconhecido.</p>

            <p>Esse processo pode ser compreendido a partir das representações sociais, que tornam familiar aquilo que parece estranho. Moscovici foi um importante pensador que estudou as representações sociais. Ele discute como crenças e interpretações compartilhadas por um grupo passam a constituir formas coletivas de compreender a realidade. As representações sociais envolvem crenças e valores, transmitidos pela tradição e partilhados nos grupos, que assim dão sentido ao mundo que os cerca.</p>

            <p>Desse modo, o senso comum é um espaço importante de produção das representações sociais. O problema surge quando opiniões passam a ocupar o lugar de um conhecimento que exige formação, avaliação e responsabilidade. Quando falamos sobre diagnóstico, precisamos reconhecer os limites dessas interpretações, sem desconsiderar o valor das experiências cotidianas nem o conhecimento científico produzido pelos especialistas.</p>

            <p>É importante salientar que o senso comum não é, por si só, um conhecimento sem valor. Ao contrário, muitos conhecimentos científicos também têm sua origem no senso comum. Porém, é preciso ter cuidado com o que se diz: recorrer à categorização e, muitas vezes, estereotipar os sujeitos pode retirar o mérito do conhecimento científico. Vivemos em tempos em que é preciso defender o que foi construído e pensado por aqueles que vieram antes de nós e dedicaram anos à pesquisa. Esse conhecimento reificado é o campo em que os especialistas falam a partir dos conhecimentos construídos pela ciência.</p>

            <p>Desse modo, nem toda pessoa autista é agitada, tem altas habilidades ou seletividade alimentar, porque não há um modelo pronto e universal. Cada ser humano é único e singular em sua existência.</p>

            <p>Por outro lado, crianças que são bastante ativas, correm, brincam e questionam podem estar apenas expressando sua curiosidade diante das descobertas do mundo. Hoje, muitas aprendem desde cedo a ficar quietas diante de uma tela. O celular é usado como entretenimento e também pode se tornar uma ferramenta para pais ou responsáveis conterem comportamentos que incomodam.</p>

            <p>Mas o que seria o normal e o anormal? A normalidade tem intensidade? Quais são os elementos que permitem pensar a normalidade no cenário em que vivemos? A normalidade se constrói com o tempo, tem caráter histórico e é atravessada pela cultura, pelas tradições, pelo ambiente, pelo desenvolvimento psicossocial e pelos papéis que atribuímos à criança, ao adolescente e ao adulto.</p>

            <p>Vamos a um exemplo: quando eu era criança, nos anos 1980, as crianças corriam, pulavam, subiam em árvores e passavam o dia na rua brincando. Eram vistas como ativas e normais. Hoje, essa mesma criança poderia despertar uma suspeita de TDAH. Isso não quer dizer que o TDAH não existisse naquela época, nem que todas as crianças agitadas de hoje estejam sendo diagnosticadas de forma equivocada. Ao comparar essas infâncias, penso também em como mudaram as expectativas dos adultos, os espaços para brincar e a tolerância aos comportamentos infantis. É essa mudança no modo de olhar para a criança que me faz refletir. Hoje em dia, quantas crianças você vê brincando na rua, andando de bicicleta ou tendo uma infância mais próxima da natureza?</p>

            <p>Ao mesmo tempo, a mercantilização do atendimento ganha cada vez mais espaço. De Petrolina a Cascavel, tenho observado clínicas surgirem em todos os lugares, oferecendo atendimentos muitas vezes precarizados, com sessões de 30 minutos, rotatividade de profissionais e salas em que mal cabem o profissional e a criança, entre outras precariedades.</p>

            <p>Aqui chego a um ponto importante: não quero questionar doenças, transtornos ou diferenças, nem invalidar diagnósticos; muito pelo contrário. A preocupação é tratar a saúde mental com responsabilidade e ética, pois compreendo que quem tem um transtorno ou uma condição do neurodesenvolvimento pode precisar de medicamento, terapia, acompanhamento de vários profissionais e adaptações em diferentes espaços. Muitas dessas pessoas sofrem preconceito no cotidiano ou têm seus direitos violados, seja pela falta de acesso às políticas públicas, seja pela falta de acesso a terapias eficazes. Na área profissional, já ouvi muitos relatos de mães atípicas cujos filhos tiveram matrículas escolares negadas, que receberam olhares atravessados ou que enfrentam as angústias de uma maternidade idealizada, enquanto a vida lhes impôs outra realidade, com novos desafios e enfrentamentos.</p>

            <p>O DSM e a CID são instrumentos importantes para orientar a classificação e a avaliação de condições de saúde com base em critérios técnicos e científicos; não foram feitos para rotular pessoas. Assim, dizer que uma criança “é autista” depois de uma conversa na sala de espera não tem o mesmo peso de um diagnóstico estabelecido por profissional habilitado, após uma avaliação cuidadosa. A avaliação psicológica ou neuropsicológica pode contribuir para esse processo, considerando a escuta, a história do desenvolvimento, os testes, quando indicados, e outros dados relevantes que o profissional irá avaliar e interpretar para chegar às suas conclusões. A definição diagnóstica deve considerar as atribuições dos profissionais habilitados e, quando necessário, o trabalho conjunto das equipes multiprofissionais.</p>

            <p>Por isso, acredito que a escuta qualificada e o trabalho de profissionais capacitados continuam sendo fundamentais na saúde mental. Para mim, é necessário conhecer a história da pessoa e as condições em que vive antes de reduzir seus comportamentos a uma classificação. Isso não significa negar a importância dos diagnósticos ou dos tratamentos. Uma pessoa pode precisar de medicação, psicoterapia ou acompanhamento especializado e, ainda assim, continuar sendo muito mais do que sua condição.</p>

            <p>Volto à sala de espera. Entre as conversas na recepção, observo as pessoas e penso nas frases que ouvi. Incomoda-me perceber como, muitas vezes, um diagnóstico parece definir quem alguém é. As representações sociais influenciam nossa maneira de compreender o outro; por isso, considero importante questionar as crenças e os valores que compartilhamos. Afinal, quem é aquela pessoa, além do que dizem que ela tem?</p>
          </div>
        `
      },

      // CAPÍTULO 9 - LAURA MARTINS (PÁGINAS 45 - 50)
      {
        type: 'content',
        chapter: 'A Infância na Era Digital',
        author: 'Laura do Prado Eliziário Martins',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-teal">Capítulo 9</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">A INFÂNCIA NA ERA DIGITAL: O PAPEL DAS RELAÇÕES SOCIAIS NO DESENVOLVIMENTO HUMANO</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Laura do Prado Eliziário Martins (@laura_do_prado)</p>

            <p>Desenvolvida no contexto da Rússia do início do século XX, a Psicologia Histórico-Cultural trouxe uma importante contribuição para compreender o desenvolvimento humano: nossa maneira de pensar e agir não depende apenas de fatores biológicos, mas também das relações sociais e da cultura em que estamos inseridos. Essa perspectiva nos leva a refletir sobre uma questão importante: como as experiências vividas na infância contribuem para a formação do pensamento e do comportamento humano?</p>

            <p>Ao discutir o trabalho em <em>O capital</em>, Karl Marx compara a atividade de uma abelha à de um mestre de obras, destacando que o ser humano é capaz de imaginar e planejar mentalmente o resultado de sua atividade antes de realizá-la. Essa comparação ajuda a compreender a importância da consciência e da intencionalidade na ação humana. No desenvolvimento infantil, essas capacidades também são construídas gradualmente, por meio das experiências, da linguagem e das relações com outras pessoas.</p>

            <p>No caso das crianças, esse “mestre de obras” inicial é o adulto, a família e a escola. Quando duas crianças brincam juntas, nem sempre as coisas acontecem como elas gostariam. Às vezes, é preciso esperar a vez, aceitar que o colega ganhou ou encontrar uma solução para um desentendimento. Nessas situações, a presença de um adulto pode ajudar a criança a compreender o que sente, respeitar o outro e pensar em maneiras de resolver o problema. Aos poucos, experiências como essas contribuem para o desenvolvimento da atenção voluntária e da capacidade de controlar as próprias ações.</p>

            <p>A relação entre o biológico e o cultural é evidenciada na análise de Vigotski sobre as Funções Psicológicas. Segundo essa perspectiva, as Funções Psicológicas Elementares (FPE) são comuns a humanos e animais, englobando aspectos como a atenção e a memória involuntárias. Por outro lado, as Funções Psicológicas Superiores (FPS) são características da espécie humana e incluem o controle consciente do comportamento, a atenção e a memória voluntárias, a memorização ativa, o pensamento abstrato, o raciocínio dedutivo e a capacidade de planejamento.</p>

            <p>A origem das FPS é identificada como cultural. No começo, os adultos ou as crianças mais velhas são mediadores do contato da criança com o mundo. À medida que as crianças crescem, os processos que eram partilhados com os adultos ou outras crianças passam a ocorrer dentro delas mesmas. Com o desenvolvimento, a criança passa a realizar por conta própria ações que, inicialmente, dependiam da orientação de outras pessoas. Assim, formas de pensar e agir construídas nas relações sociais passam a integrar seu próprio funcionamento psicológico.</p>

            <p>Essa premissa básica da Teoria Histórico-Cultural — a de que a mente humana não se desenvolve de forma isolada ou puramente biológica, mas é moldada pelas interações sociais, pela cultura e pela linguagem — nunca foi tão desafiada quanto no século XXI. O problema surge quando o uso das telas passa a ocupar o espaço de experiências importantes para o desenvolvimento infantil, como as brincadeiras compartilhadas, as conversas e a convivência com outras pessoas. Diferentemente de algumas interações digitais, que oferecem respostas rápidas e permitem trocar de conteúdo a qualquer momento, as relações humanas exigem escuta, paciência e capacidade de lidar com situações inesperadas. Quando essas experiências são substituídas de maneira recorrente pelo uso passivo de dispositivos, podem ser reduzidas as oportunidades de exercitar habilidades como a atenção voluntária, a autorregulação e a resolução de conflitos.</p>

            <p>Na prática pedagógica, como educadora da Educação Infantil e do Ensino Fundamental I, considero o cenário preocupante: há alunos apáticos, sonolentos e dispersos, com dificuldade para concluir atividades simples, e crianças extremamente inquietas. A explicação para esses comportamentos, muitas vezes, aparece em conversas reveladoras com as famílias: uso do celular para assistir a vídeos e jogar sem limite de tempo, sem supervisão e sem rotina para a realização das tarefas ou dos estudos diários e, principalmente, sem horário definido para dormir. São noites mal dormidas e rotinas inexistentes na vida de crianças que, teoricamente, deveriam estar no auge de sua energia e curiosidade para aprender.</p>

            <p>O que muitos pais não compreenderam é que o cérebro da criança está em desenvolvimento e precisa descansar para se estruturar. Com a sobrecarga de estímulos visuais e sonoros durante o dia e até altas horas da noite, o cérebro pode ter dificuldade para realizar processos neurais como organizar as memórias, eliminar conexões desnecessárias e restaurar as funções cognitivas para o aprendizado do dia seguinte.</p>

            <p>Na rotina escolar, dificuldades de concentração e de autorregulação despertam preocupações entre educadores e familiares. Atualmente, têm crescido os encaminhamentos e diagnósticos de déficit de atenção em crianças cada vez mais novas, frequentemente associados ao TDAH (Transtorno do Déficit de Atenção com Hiperatividade), um transtorno neurobiológico. Em muitos casos, as crianças são medicadas cada vez mais cedo para controlar a agitação e melhorar a atenção. Embora o uso excessivo ou inadequado das telas mereça atenção, não é possível atribuir a ele, isoladamente, a causa dessas dificuldades ou dos diagnósticos. Por isso, é necessário considerar tanto as características individuais da criança quanto as experiências e condições do ambiente em que ela vive.</p>

            <p>No entanto, diante de vídeos curtos e acelerados, percebe-se que as crianças reagem instantaneamente, o que favorece a análise de que o algoritmo oferece gratificação imediata e períodos curtos de atenção. Na tela, se algo frustra, basta arrastar o dedo para o lado. A tecnologia também pode proporcionar experiências de aprendizagem, comunicação e cooperação, mas, sem a mediação de um mestre de obras humano, a criança corre o risco de agir por impulso, sem desenvolver a intencionalidade de suas ações.</p>

            <p>É por meio da comunicação com o adulto que a atividade consciente da criança se transforma, caracterizando uma ação voluntária. Longe de ser um processo puramente orgânico, a organização das nossas funções mentais depende desse vínculo social. É justamente essa mediação que nos capacita a dominar a própria mente: a habilidade tão humana de selecionar os estímulos que realmente importam e ignorar o restante do ruído ao redor não é um mero reflexo, mas o resultado de uma função psicológica superior plenamente desenvolvida.</p>

            <p>É fundamental esclarecer que o problema não é a tecnologia em si, mas a substituição da experiência viva por uma interação empobrecida. O meio não é um cenário neutro: ele molda as ferramentas que a criança tem para pensar. A criança não escolhe sozinha o ambiente em que cresce; as condições são oferecidas pelos adultos. Se o ambiente cotidiano é dominado por interfaces que demandam pouca ou nenhuma reciprocidade humana, a capacidade de simbolizar e de se colocar no lugar do outro pode ficar comprometida.</p>

            <p>Defender a infância na era digital não significa rejeitar a tecnologia, mas reconhecer que o desenvolvimento humano precisa de experiências que nenhuma tela, sozinha, pode substituir: o diálogo, a brincadeira, o afeto e a convivência com outras pessoas. Cabe à família, à escola e à sociedade garantir que os recursos digitais sejam utilizados de maneira consciente, sem ocupar o lugar das relações que contribuem para a formação do pensamento, da autonomia e da capacidade de conviver. Portanto, cabe a nós garantir que a tecnologia seja apenas uma ferramenta, e não o ambiente principal em que a infância se desenvolve.</p>
          </div>
        `
      },

      // CAPÍTULO 10 - ADONIS SILVA (PÁGINAS 51 - 56)
      {
        type: 'content',
        chapter: 'Habitar para Além da Forma',
        author: 'Adonis Luiz Osmar Silva',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-coral">Capítulo 10</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">HABITAR PARA ALÉM DA FORMA: A ARQUITETURA COMO CUIDADO COM A MENTE</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Adonis Luiz Osmar Silva (adonislos.arquitetura@gmail.com | @adonis.professor)</p>

            <p>Em aproximadamente quinze anos trabalhando com projetos de arquitetura, uma coisa sempre me chamou a atenção e quase nunca aparece claramente no desenho: como as pessoas se sentem dentro do espaço. Na minha experiência, já vi um cliente entrar num ambiente com iluminação natural e respirar aliviado. Já vi outro se encolher, sem perceber, num ambiente escuro, apertado e abafado. Quarto, sala de aula, consultório, tanto faz: o lugar mexe com a gente. O tempo que ficamos ali, por onde entra a luz, onde está o sofá, a cor da parede: tudo isso pesa no humor, no sono e naquela sensação difícil de explicar, que é a de estar seguro. Foram essas e muitas outras observações, feitas no dia a dia de trabalho, que acabaram me levando a pensar na psicologia como caminho para o bem-estar do usuário.</p>

            <p>Olhando por esse lado, a arquitetura vai além de construir abrigo. Ela pode cuidar e acolher. Um projeto que considera a relação entre a mente, o corpo, a ergonomia e as emoções de quem vai morar ali ajuda a dormir melhor, a manter a atenção, a atravessar dias difíceis e a se sentir em casa, no sentido mais literal da expressão. É sobre o espaço construído e a vida que acontece dentro dele que quero falar aqui: de onde viemos, o que a pesquisa já mostrou e também para onde as coisas parecem estar indo.</p>

            <p>Mas nem sempre se pensou assim. No começo do século XX, o modernismo chegou com ideias que mudaram tudo, e Le Corbusier chegou a definir a casa como uma “máquina de morar”. Anos depois, criou o Modulor, um sistema de medidas baseado num corpo humano idealizado, para servir de base no dimensionamento de portas, móveis e cômodos. Tinha mérito, e não pouco: a construção ficou mais racional, a moradia chegou a mais gente, e casas que antes eram úmidas e escuras ganharam luz e ar. O problema é que, para padronizar o ser humano, foi preciso fingir que somos todos iguais. Quem era mais alto ou mais baixo, o idoso, a criança, a pessoa com deficiência: todos ficaram de fora dessa régua. E as diferenças emocionais de cada um nem entraram na conta. Em muitos casos, o resultado foi uma arquitetura eficiente, sim, mas reta, repetitiva e pouco atenta a quem mora nela. É algo que ainda vemos hoje em muitas casas em que a fachada importa mais que o interior.</p>

            <p>Foi aí que a psicologia começou a prestar atenção nos espaços. Nos anos 1960, ganhou corpo a psicologia ambiental, campo que estuda como o ambiente físico interfere no comportamento, nas emoções e no bem-estar do usuário. Um dos trabalhos que mais me marcaram é de 1984. O pesquisador Roger Ulrich comparou pacientes operados num mesmo hospital: os que tinham vista para árvores pela janela se recuperaram mais rápido e precisaram de menos analgésicos do que os que passavam o dia olhando para uma parede de tijolos. Uma janela. Não foi ela que curou ninguém — quem fez isso foram os médicos, os remédios e o próprio corpo. Mas ela ajudou. Virou mais uma ferramenta a favor da recuperação, e o estudo abriu caminho para muita pesquisa depois. No mesmo ano, o biólogo Edward O. Wilson popularizou a biofilia, a hipótese de que trazemos em nós uma necessidade muito antiga de contato com a natureza, o famoso “pé no chão”. De lá para cá, aos poucos, a arquitetura foi tirando o olho do objeto e olhando mais para a experiência de quem usa.</p>

            <p>Hoje, isso aparece no projeto de forma bem prática. A iluminação é um bom exemplo: arquitetos preocupados com a saúde do morador não pensam mais só em quantos lux o ambiente precisa, mas em como a luz conversa com o relógio biológico. Muita luz natural durante o dia e, à noite, uma luz mais quente e mais baixa ajudam a regular o sono e o humor. Ventilação cruzada, plantas, madeira, pedra, água por perto, uma vista para o verde: tudo isso diminui o estresse e ajuda a concentrar. Cor também conta, mas aqui eu fujo de tabela pronta. Tons mais calmos costumam acolher, e cores fortes, em pontos certos, dão energia; só que a luz do ambiente, a cultura e a história de cada pessoa mudam muito essa leitura. Não existe fórmula. São recursos que, combinados com atenção a quem vai usar o espaço, fazem um ambiente comum virar um lugar onde a pessoa se sente segura.</p>

            <p>Lembro de uma reforma em que isso ficou muito claro para mim. Era o apartamento de uma senhora que morava sozinha, com uma sala escura, um sofá pesado na frente da janela e uma cortina grossa que vivia fechada. Ela dizia que não gostava de ficar ali. A obra foi simples: tiramos a cortina, mudamos o sofá de lugar, clareamos as paredes e trocamos a iluminação por uma luz mais quente. Quando ela entrou, ficou um tempo parada, olhando para a janela. Depois, sentou, passou a mão no braço do sofá e disse que agora dava vontade de tomar café ali. Meses depois, a filha me contou que a mãe tinha voltado a receber as amigas em casa.</p>

            <p>Essa atenção pesa ainda mais quando o projeto é para alguém com necessidades específicas. Adaptar uma casa para uma pessoa com deficiência não pode se resumir a rampa e barra de apoio. A casa precisa devolver autonomia e dignidade, deixar que a pessoa circule, alcance as coisas e tome decisões sozinha. E ninguém sabe melhor o que atrapalha do que a própria pessoa; por isso, vale ouvi-la desde o primeiro rabisco. Para quem convive com ansiedade, depressão ou outras questões de saúde mental, a lógica é parecida, e a casa pode virar uma aliada: um canto de refúgio, caminhos livres e fáceis de entender, controle sobre a luz e o barulho, algum contato com o verde, uma organização que passe calma e previsibilidade. O que funciona varia muito de uma pessoa para outra, e nada disso substitui terapia ou acompanhamento médico. Mas a casa pode ser um lugar que ajuda, em vez de mais uma coisa que pesa. E tem um efeito colateral bom nisso: quando a gente projeta pensando em quem mais precisa, o resto da família costuma sair ganhando junto.</p>

            <p>Tem um outro lado que não dá para ignorar. A maior parte das pessoas neste país nunca vai contratar um arquiteto e, mesmo assim, merece morar bem. Existe a Lei de Assistência Técnica (Lei 11.888/2008), que garante projeto gratuito para famílias de baixa renda, mas ela ainda é pouco usada e pouco conhecida. Enquanto isso não muda, muita coisa cabe no bolso: tirar o móvel da frente da janela, deixar o ar circular, pintar a parede de uma cor mais clara, usar uma lâmpada mais amarela à noite, ter uma planta por perto. Não resolve tudo, mas já faz diferença. Bem-estar não pode ser coisa só de quem pode pagar.</p>

            <p>Daqui para a frente, a tendência é que essa conversa entre arquitetura e psicologia fique mais profunda. A neuroarquitetura, um campo ainda novo, já estuda como o cérebro responde aos espaços, e existem certificações que avaliam um edifício pela saúde e pelo bem-estar de quem está dentro dele, não só pelo desempenho técnico. Iluminação que acompanha o ciclo do dia, sensores que ajustam a temperatura e o ruído: a tecnologia vai deixar os ambientes cada vez mais ajustados às pessoas. Ainda assim, aposto que a mudança que mais importa vai ser outra: criar o hábito de escutar antes de desenhar e de enxergar o usuário como alguém com história, corpo e emoções, e não como uma medida média.</p>

            <p>Hoje, dividido entre os projetos e a psicologia, vejo que as duas sempre trataram, cada uma do seu jeito, do mesmo assunto: pessoas. A arquitetura cuida do espaço que nos abriga. A psicologia, do espaço que a gente carrega por dentro. Quando trabalham juntas, o que sai não é só uma casa: é um lugar onde dá para descansar, se recuperar e simplesmente ficar bem. Para mim, esse é o grande desafio de projetar hoje: lembrar que, antes da forma, existe alguém que vai viver naquele lugar e precisa ser feliz nele.</p>
          </div>
        `
      },

      // CAPÍTULO 11 - JEFERSON LIMA (PÁGINAS 57 - 61)
      {
        type: 'content',
        chapter: 'Terapia Assistida por Cães e a Psicologia',
        author: 'Jeferson Deobald Lima',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-gold">Capítulo 11</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">TERAPIA ASSISTIDA POR CÃES E A PSICOLOGIA</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Jeferson Deobald Lima (@Jefersondeobaldlima)</p>

            <p>Como os cães poderiam auxiliar no tratamento de diferentes transtornos, distúrbios ou outras questões relacionadas à saúde mental? Sendo mais específico: os cães podem auxiliar na prevenção e no tratamento da depressão?</p>

            <p>O trabalho do psicólogo em saúde mental busca apoiar a regulação emocional, ajudando o paciente ou cliente a encontrar seu caminho e a enfrentar dificuldades e dores emocionais. Esse processo pode envolver reflexão, treinamento e diferentes técnicas ou abordagens, muitas vezes com o uso de ferramentas lúdicas, pedagógicas, testes e animais.</p>

            <p>Estudos investigam os estímulos que os animais provocam no organismo humano. Os cães, em particular, podem ser importantes aliados no cuidado de diferentes transtornos e condições de saúde mental e física. Eles são utilizados em terapias, psicoterapias e estudos científicos desde a década de 1950. Já a pesquisa sobre seu uso especificamente no tratamento da depressão e sua validação científica ganhou força na década de 1990.</p>

            <p>A utilização de cães em terapia ou psicoterapia envolve a interação afetuosa entre o paciente e o animal. O contato pode consistir numa troca de olhares, em carícias no pelo ou num abraço, proporcionando uma sensação de relaxamento e tranquilidade. Também pode envolver exercícios de obediência, que estimulam a autoconfiança: ao dar comandos e perceber que o cão responde, o paciente pode vivenciar um ciclo de reforço positivo. Essa prática pode ser incorporada a diferentes abordagens para favorecer o vínculo entre paciente e psicólogo. Mesmo sem ter um cão ou conhecer técnicas de adestramento, o psicólogo pode contar com a colaboração de um profissional adestrador para planejar as atividades. A terapia assistida por animais pode ser considerada em diferentes contextos, como no trabalho com depressão, fobias, síndrome do pânico e regulação emocional de crianças autistas, sempre de acordo com as necessidades de cada pessoa. É claro que, se o paciente tiver medo de cães ou um trauma relacionado a uma mordida, o animal poderá ser um estímulo aversivo; nesse caso, o processo terapêutico deverá ser diferente.</p>

            <p>Um cão, integrado ao trabalho terapêutico, pode auxiliar o psicólogo na condução das atividades de forma espontânea e estimular o paciente a retornar ou a manter seus compromissos com a psicoterapia. Estudos sobre a interação com animais investigam possíveis efeitos sobre o estresse e o bem-estar. Na minha experiência, durante essas atividades, era possível perceber o relaxamento e o bem-estar dos participantes.</p>

            <p>Minha primeira participação em uma atividade de terapia assistida por animais (TAA) foi na década de 2000, em uma universidade de Cascavel. Como voluntário num projeto do curso de Fisioterapia, treinei por cerca de um ano uma cadela da raça Golden Retriever, chamada Lassie, para o atendimento de crianças com deficiência e outras necessidades específicas, com aproximadamente quatro anos de idade. Na década de 2010, participei pela primeira vez de um trabalho de TAA na área da Psicologia, em um projeto que propus junto ao FUSEx (Fundo de Saúde do Exército). Atuei como treinador voluntário por três anos com minha cadela, Aghata, também Golden Retriever, ao lado de uma psicóloga e de crianças com necessidades especiais e deficiência.</p>

            <p>Nessa fase do meu trabalho, uma paciente chamou muito a minha atenção. Antonieta (nome fictício) tinha apenas cinco anos e era cega de nascença. O pai tinha dificuldade em aceitar as limitações da filha, o que desencadeou brigas com a mãe e, posteriormente, a separação do casal. Nesse contexto, Antonieta desenvolveu crises de pânico e aversão à figura masculina e à voz de homens. A TAA com a Aghata foi então incorporada às atividades de psicoterapia.</p>

            <p>No primeiro contato da criança com a cadela, fiquei a alguns metros de distância, perto o suficiente para controlar o animal enquanto Antonieta interagia com a Aghata sob a orientação da psicóloga. O banho e a escovação foram feitos antes do atendimento, pois o contato com as mãos e o odor deveriam ser agradáveis. Antonieta gostou da interação e passou a pedir a participação da Aghata em todas as sessões. Nas primeiras vezes, quando ouvia minha voz, a menina se agitava, chorava e, às vezes, gritava. Então, eu me afastava o bastante para que a psicóloga conseguisse acalmá-la.</p>

            <p>Aos poucos, ao longo de cerca de oito sessões, Antonieta passou a associar minha voz à presença da Aghata, permitindo gradualmente a minha aproximação, até me receber com abraços na chegada e na despedida. Nas últimas sessões, conduzia a Aghata pela guia, comigo ao lado para auxiliá-la. A mãe e a psicóloga relataram uma evolução importante no vínculo comigo e uma diminuição das crises de pânico.</p>

            <p>Em um evento realizado pela Universidade UNOPAR, participei com Zoe, uma cadela Golden Retriever, de uma atividade que combinava a interação com o animal e técnicas de <em>mindfulness</em>, ou atenção plena. Foram realizadas atividades de relaxamento com alunos que visitavam a feira. Em um caso específico, a experiência teve um desfecho que me surpreendeu.</p>

            <p>A atividade foi feita com uma adolescente de dezesseis anos. Colocamos um colchão no chão, com Zoe deitada sobre ele e a adolescente posicionada ao lado. Pedi que ela fechasse os olhos e colocasse as duas mãos nas costas da cadela. Em seguida, orientei-a a inspirar pelo nariz e soltar o ar pela boca, enquanto passava as mãos nas costas de Zoe, concentrando-se na sensação do contato.</p>

            <p>Depois, pedi que imaginasse uma paisagem com rios e pôr do sol e, enquanto acariciava a cadela, visualizasse entrar num rio de águas cristalinas até a água alcançar a altura das canelas. Orientei-a a olhar para os próprios pés e a imaginar o som da água correndo e batendo nas pedras. Após algum tempo guiando esse exercício de relaxamento, pedi que abrisse os olhos e perguntei como estava se sentindo e se a experiência havia sido agradável. Ela começou a chorar e relatou que fazia muito tempo que não sentia paz e que não se sentia tão bem, leve e feliz.</p>

            <p>Na minha percepção e conforme o relato da própria participante, a atividade foi um momento sem estresse nem cobranças, dedicado ao exercício de atenção às emoções. A experiência pareceu ajudá-la a se afastar por alguns instantes do sofrimento, perceber que poderia levar a vida com mais leveza e reconhecer a possibilidade de sentir felicidade.</p>

            <p>Treinar um cão para oferecer apoio emocional às pessoas e poder integrar esse trabalho às terapias, colocando em prática o conhecimento que adquiri ao longo de cinco anos de faculdade, reforça a sensação de que estou no caminho certo. Acredito que esse trabalho poderá contribuir para o bem-estar dos meus futuros pacientes e ajudá-los a perceber que podem aprender a regular suas emoções e cultivar momentos de felicidade — algo que também me faz bem.</p>
          </div>
        `
      },

      // CAPÍTULO 12 - CLAUDIO FONSECA (PÁGINAS 62 - 66)
      {
        type: 'content',
        chapter: 'A Psicologia que eu Quero Exercer',
        author: 'Claudio Garcia da Fonseca',
        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-wine">Capítulo 12</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">A PSICOLOGIA QUE EU QUERO EXERCER</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Claudio Garcia da Fonseca (@claudiogarcia)</p>

            <p>Escolhi a Psicologia por gostar de ajudar o próximo. Sempre me senti tocado por isso: pessoas próximas me pediam conselhos e ajuda em diversas situações. Chegou um momento em que senti necessidade de adquirir mais experiência e conhecimento nessa área da ciência. Eu mesmo já precisei de uma psicóloga para compreender e trabalhar minhas questões. Na faculdade, cada atendimento de estágio na clínica me deu a certeza da minha escolha. Ver, em cada rosto, em cada história e em cada sessão, a transformação que essa profissão promove na vida das pessoas me fez querer ainda mais seguir esse caminho.</p>

            <p>Hoje penso que o mundo já está cheio de agulhas tentando, a todo momento, furar o balão da vida de cada um. Por isso, quero ser o oxigênio que devolve ao balão o ar que ele perdeu: não para impedir que as agulhas existam, mas para ajudar as pessoas a recuperarem a esperança de dias melhores, de sonhos e de uma vida pela frente.</p>

            <p>A Psicologia que quero exercer começa, antes de tudo, pela escuta ativa e personalizada e pelo acolhimento. Desejo ser um profissional capaz de enxergar cada indivíduo com o coração, para além de seus diagnósticos, patologias, dificuldades e comportamentos, compreendendo que, por trás de cada história, existe um ser humano com sentimentos, experiências de vida, medos e lutas próprias.</p>

            <p>Quero exercer uma Psicologia fundamentada no respeito e na ética que rege a profissão; uma Psicologia que vá além de respostas prontas e que, principalmente, saiba formular perguntas capazes de promover reflexão em cada paciente. Quero ser um profissional que respeite o silêncio e caminhe ao lado de quem necessita de apoio para compreender e definir os próximos passos da própria vida.</p>

            <p>Durante a graduação, aprendi como um futuro profissional deve se portar e também que não preciso ter respostas para tudo, mas, sim, estar aberto a ouvir todos que, em algum momento, me procurarem. Entendi a importância de estudar continuamente, reconhecer minhas limitações, levar o que aprendi para a prática profissional e deixar rastros positivos na vida de quem passar por mim.</p>

            <p>A Psicologia que quero praticar reconhece o sofrimento e as dificuldades de cada pessoa, mas também sua capacidade de buscar ajuda e se transformar. Espero que meu trabalho proporcione às pessoas um lugar seguro e acolhedor, onde possam conversar, refletir e compreender suas demandas, descobrindo novas possibilidades diante do que vivem.</p>

            <p>Acredito que cada ser humano carrega angústias ao longo da vida e que, às vezes, podemos nos comparar a uma faca em processo de fabricação: para ganhar forma e resistência, ela passa pelo fogo. O fogo simboliza nossas angústias, tristezas e ansiedades: quanto maior a temperatura, maior o desconforto que essas dificuldades nos causam e mais elas nos tiram da zona de conforto. Podemos dizer que a terapia é o espaço em que, diante desse fogo, somos confrontados com nossas experiências de vida, comportamentos e sentimentos. A psicoterapia nos ajuda a moldar nosso modo de ser, a sermos autores de nossas vidas e a desenvolvermos autoconhecimento e autoconsciência sobre quem somos e como agimos diante das nossas vivências, em vez de sermos apenas espectadores da própria vida. Que possamos buscar essa autoria, sem esquecer: o fogo não é motivo para agradecer nem para romantizar o próprio sofrimento. A psicoterapia ajuda as pessoas a compreender suas demandas e a encontrar maneiras de lidar com cada situação.</p>

            <p>Carl Jung, psiquiatra e psicoterapeuta suíço, trouxe contribuições importantes para o processo terapêutico. Podemos lembrar uma ideia a ele associada: “Que possamos conhecer todas as teorias, dominar todas as técnicas, mas, ao tocar uma alma humana, que sejamos apenas outra alma humana”. Essa mensagem é profunda, pois, no dia a dia, como psicólogo, conhecerei diversas histórias, vidas e demandas, talvez até parecidas, mas todas singulares. Ser apenas outra alma humana, para mim, é suspender meus valores e as verdades que talvez considere únicas e absolutas. Muitos gritos de socorro não saem da boca para fora; alguns são gritados da boca para dentro. Que eu seja um profissional que busque todas as formas possíveis de apoiar a outra vida que está diante de mim.</p>

            <p>Ao escrever este capítulo, lembro-me de muitas experiências e vitórias interiores vividas ao longo do curso de Psicologia, principalmente nos últimos semestres e, de modo especial, no último, quando me vem com frequência uma pergunta: “E agora?”. Pensando bem, essa pergunta está tão presente porque carrega o medo de não fazer a diferença na vida das pessoas e, ao mesmo tempo, a expectativa de ser alguém que faça sentido na vida de quem me procura e de aprender com cada atendimento. Na graduação, não fui formado para ser o melhor, mas para dar o melhor de mim a cada pessoa que chega até mim para uma conversa e, talvez, apenas para encontrar uma presença. Precisamos falar sobre o trabalho do psicólogo: às vezes, temos a visão de que ele precisa sempre ter respostas para tudo, mas isso é uma ilusão. O psicólogo precisa sustentar um ambiente de confiança e cuidado para construir, junto com o paciente, possibilidades para sua vida e ajudá-lo a desenvolver novas habilidades.</p>

            <p>É importante esclarecer algo: o profissional de Psicologia facilita o processo para que cada paciente possa enxergar novos recursos para a vida, mas não pode correr o risco de carregar a vida do outro como se fosse sua, pois isso o deixa sem clareza para ajudar de fato quem o procura. Que eu seja um profissional consciente dos meus limites e um instrumento de clareza para que o paciente consiga perceber, construir e colocar em prática, em todas as áreas de sua vida, aquilo que aprendeu em terapia.</p>

            <p>Aprendi, ao longo do curso, que a terapia, para funcionar de forma eficaz e gerar resultados positivos, precisa ser um trabalho conjunto com o paciente. Assim, pretendo ajudar as pessoas a reconhecerem a própria força e a atravessarem os dias difíceis.</p>

            <p>Encerro este capítulo com a certeza de que terei muitos desafios pela frente, mas desejo ser um profissional que ajude o próximo, apesar deles. Quero estar ao lado de quem me procurar pedindo ajuda e esclarecimentos. Se, ao final de cada dia, alguém puder sair da sessão com mais clareza e esperança, ficarei feliz por ter cumprido o meu papel. Essa é a Psicologia que quero exercer.</p>

        `

      {

        html: `
          <div class="space-y-3 font-serif text-gray-800 leading-relaxed text-xs sm:text-sm">
            <span class="text-[10px] font-sans uppercase font-bold tracking-widest text-brand-teal">Capítulo 13</span>
            <h2 class="font-display text-lg sm:text-xl font-bold text-gray-950 leading-tight">A PAIXÃO QUE NÃO ESTAVA NOS PLANOS: QUANDO A DOCÊNCIA NOS ENCONTRA</h2>
            <p class="text-[11px] font-sans text-gray-600 font-semibold mb-2">Camila Maders (<a href="mailto:camila.maders@cogna.com.br" class="underline">camila.maders@cogna.com.br</a>)</p>

            <p>Ser professor é vocação, paixão ou acaso? Nunca pensei muito nessa pergunta até perceber que, às vezes, a docência chega à nossa vida sem que tenhamos planejado. Nem sempre sonhamos em ser professores desde a infância ou imaginamos que um dia estaríamos diante de uma sala de aula. A vida vai acontecendo, as oportunidades aparecem e, quando percebemos, estamos planejando aulas, estudando, buscando novas referências e pensando em como poderíamos fazer diferente na próxima vez.</p>

            <p>Acredito que a paixão pela docência nem sempre nasce antes da escolha. Às vezes, ela aparece depois, no cotidiano, entre uma aula e outra. Começa quando percebemos que gostamos de explicar um conteúdo de um jeito diferente, quando uma pergunta de um estudante nos faz pensar ou quando vemos alguém compreender algo que antes parecia difícil. São momentos que talvez pareçam pequenos para quem está de fora, mas que, para nós, passam a ter um significado especial.</p>

            <p>Com o tempo, percebemos que a docência começa a ocupar espaços que vão além da sala de aula. Pensamos em uma atividade enquanto estamos em casa, encontramos uma referência e já imaginamos como utilizá-la com os estudantes, terminamos uma aula e ficamos pensando no que poderíamos ter feito de outra maneira. Nem sempre conseguimos separar completamente o trabalho daquilo que somos, porque ensinar passa a fazer parte da nossa maneira de olhar para o mundo. E é curioso perceber que algo que talvez nem estivesse nos nossos planos acaba se tornando tão nosso.</p>

            <p>Mas nem todo mundo entende essa escolha. “Mas por que dar aulas?”, já ouvimos ou talvez até tenhamos nos perguntado. Por que dedicar tanto tempo a uma profissão que exige tanto? Por que continuar diante de tantas cobranças, dificuldades e, muitas vezes, pouca valorização? São perguntas que não têm respostas simples. A docência cansa, exige disposição e, em alguns dias, coloca à prova a nossa própria vontade de continuar. Gostar do que fazemos não nos torna imunes à frustração, tampouco significa que precisamos aceitar tudo em nome da paixão pela profissão.</p>

            <p>Ainda assim, existe algo que nos faz permanecer. Talvez seja aquela satisfação difícil de explicar quando uma aula acontece como imaginávamos. Talvez seja a curiosidade de continuar aprendendo, o prazer de compartilhar o que estudamos ou a alegria de perceber que um estudante está construindo seu próprio caminho. Em algum momento, entendemos que não estamos ali apenas porque precisamos cumprir uma tarefa. Estamos porque encontramos sentido naquilo que fazemos.</p>

            <p>Para mim, uma das partes mais bonitas da docência está justamente nessa descoberta. Encontrar algo que se conecta com a nossa essência não significa ter certeza de tudo ou saber, desde o início, qual caminho seguir. Significa reconhecer aquilo que nos desperta interesse, que nos mobiliza e que nos faz sentir que estamos no lugar certo. Essa conexão não elimina as dúvidas nem torna os dias difíceis mais fáceis, mas nos ajuda a compreender por que escolhemos continuar.</p>

            <p>Ser professor também é conviver com a certeza de que nunca saberemos tudo. O conhecimento muda, as pessoas mudam e aquilo que funcionava em uma turma pode não fazer sentido em outra. Precisamos estudar, rever ideias, reconhecer quando uma estratégia não deu certo e encontrar outras possibilidades. E, por mais que estejamos ali para ensinar, os estudantes também nos ensinam. Suas perguntas, experiências e maneiras de compreender o mundo nos tiram do lugar de conforto e nos lembram de que a aprendizagem não acontece em uma única direção.</p>

            <p>Na Psicologia, essa experiência tem um significado ainda maior. Formar psicólogos não é apenas ensinar teorias, conceitos ou técnicas. É ajudar a desenvolver o olhar crítico, a responsabilidade ética e a sensibilidade necessárias para compreender a complexidade humana. É lembrar que, por trás de cada conceito, existe uma pessoa, uma história e uma realidade que não pode ser reduzida a um diagnóstico ou a uma explicação pronta. Sabemos que os estudantes que hoje estão em nossas salas de aula poderão, amanhã, acolher pessoas em momentos difíceis, participar de decisões importantes e contribuir para a vida de muitas famílias. Pensar nisso nos faz reconhecer a responsabilidade que acompanha o nosso trabalho.</p>

            <p>Nem sempre saberemos o que ficou de uma aula. Talvez um estudante se lembre de uma explicação anos depois, leve consigo uma pergunta que fizemos ou encontre em uma conversa o incentivo de que precisava naquele momento. Muitas vezes, seguimos para a próxima aula sem saber o que nossas palavras despertaram. E tudo bem não ter essa resposta. Não precisamos conhecer o alcance de cada gesto para compreender que aquilo que compartilhamos pode continuar fazendo sentido muito depois de o semestre terminar.</p>

            <p>Por isso, acredito que ensinar exige compromisso com aquilo em que acreditamos. Não precisamos ser professores perfeitos, ter todas as respostas ou acertar sempre. Precisamos levar a sério a responsabilidade que assumimos, reconhecer nossos erros e ter humildade para continuar aprendendo. A paixão pela docência não substitui a competência, o preparo ou as condições dignas de trabalho. Pelo contrário, ela ganha força quando encontra responsabilidade, respeito e disposição para fazer bem aquilo que nos cabe.</p>

            <p>Talvez ser professor seja um pouco de vocação, um pouco de acaso e muito daquilo que construímos ao longo da vida. Nem sempre chegamos à sala de aula sabendo o que essa experiência representará para nós. Às vezes, descobrimos aos poucos, entre os desafios, as conversas, as aulas que dão certo e aquelas que nos fazem repensar tudo. Quando olhamos para trás, percebemos que não foi apenas o nosso conhecimento que cresceu. Nós também mudamos, amadurecemos e passamos a enxergar a educação e as pessoas de outra maneira.</p>

            <p>Hoje, penso que encontrar a própria essência tem muito a ver com reconhecer aquilo que faz sentido, mesmo quando não conseguimos explicar completamente o porquê. Nem sempre teremos respostas para quem questiona nossas escolhas, e talvez nem precisemos ter. Algumas coisas são compreendidas mais pelo que vivemos do que pelo que conseguimos dizer. Há profissões que exercemos e há aquelas em que, ao longo do caminho, acabamos nos reconhecendo.</p>

            <p>E, quando alguém perguntar se ser professor é vocação, paixão ou acaso, talvez eu responda que não sei exatamente em que momento essa paixão começou. Sei que ela não precisava estar nos meus planos desde o início para se tornar importante. Foi sendo construída nas experiências, nos encontros e em tudo aquilo que a docência me permitiu aprender. Hoje, ensinar não significa apenas compartilhar conhecimento, mas também reconhecer uma parte de mim nessa escolha.</p>

            <p>Talvez seja esse o sentido de quando a docência nos encontra: descobrir, sem ter planejado, que aquilo que um dia parecia apenas uma possibilidade se tornou parte da nossa história. E perceber que, entre tantas coisas que aprendemos ao longo da vida, uma delas foi reconhecer aquilo que nos faz querer continuar.</p>
          </div>
        `
      },

    const sourcePages = rawPages.map((page, sourcePageIndex) => ({ ...page, sourcePageIndex }));

    /* ==========================================================================
       2. ESTRUTURAÇÃO DOS SPREADS (DUAS PÁGINAS LADO A LADO)
       ========================================================================== */
    let spreads = [];
    let currentSpreadIndex = 0;
    let currentPageIndex = 0;
    let isHighContrast = false;
    let currentFontSizeOffset = 0;
    let isRepaginating = false;

    // Estado da Síntese de Voz (TTS)

    let ttsSpeed = 1.0;

    window.onload = function() {
      rebuildPages(false);
      organizeSpreads();
      renderSpread();
      buildTOC();

    };

    function organizeSpreads() {
      spreads = [];
      // Agrupa as páginas de 2 em 2 para formato de livro aberto lado a lado
      for (let i = 0; i < rawPages.length; i += 2) {
        spreads.push({
          leftIndex: i,
          rightIndex: i + 1 < rawPages.length ? i + 1 : null,
          leftPage: rawPages[i],
          rightPage: i + 1 < rawPages.length ? rawPages[i + 1] : null
        });
      }
    }

    function isMobileLayout() {
      return window.matchMedia('(max-width: 768px)').matches;
    }

    function createMeasurementPage() {
      const page = document.getElementById('left-page-container');
      const book = document.getElementById('open-book-container');
      const bounds = isMobileLayout()
        ? { width: book.clientWidth, height: book.clientHeight }
        : { width: page.clientWidth, height: page.clientHeight };
      const measurePage = page.cloneNode(false);
      measurePage.removeAttribute('id');
      measurePage.classList.add('active-mobile');
      Object.assign(measurePage.style, {
        position: 'fixed',
        left: '-10000px',
        top: '0',
        width: `${bounds.width}px`,
        height: `${bounds.height}px`,
        visibility: 'hidden',
        pointerEvents: 'none',
        display: 'flex',
        zIndex: '-1'
      });

      const body = document.createElement('div');
      body.className = 'flex-1 page-body-content';
      body.style.flex = 'none';
      body.style.overflow = 'visible';
      if (currentFontSizeOffset !== 0) {
        body.style.fontSize = `${0.9 + (currentFontSizeOffset * 0.07)}rem`;
      }

      const footer = document.createElement('div');
      footer.className = 'page-footer mt-4 pt-2 border-t border-gray-200/60 flex justify-between items-center text-[11px] text-gray-400 font-sans';
      footer.innerHTML = '<span>VOZES DA PSICOLOGIA</span><span>Pág. 999</span>';
      footer.style.flexShrink = '0';
      measurePage.append(body, footer);
      document.body.appendChild(measurePage);

      const pageStyles = getComputedStyle(measurePage);
      const footerStyles = getComputedStyle(footer);
      const availableHeight = measurePage.clientHeight
        - parseFloat(pageStyles.paddingTop)
        - parseFloat(pageStyles.paddingBottom)
        - footer.offsetHeight
        - parseFloat(footerStyles.marginTop);

      return {
        body,
        availableHeight,
        dispose: () => measurePage.remove()
      };
    }

    function pageHtml(root, blocks) {
      const wrapper = root.cloneNode(false);
      blocks.forEach(block => wrapper.appendChild(block.cloneNode(true)));
      return wrapper.outerHTML;
    }

    function fitsPage(root, blocks, measurement) {
      measurement.body.innerHTML = pageHtml(root, blocks);
      const fontSize = parseFloat(getComputedStyle(measurement.body).fontSize);
      const bottomSafetyMargin = Math.ceil(fontSize * 1.5);
      return measurement.body.scrollHeight + bottomSafetyMargin <= measurement.availableHeight;
    }

    function splitTextBlock(block, root, measurement) {
      const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
      const words = [];
      let textNode;

      while ((textNode = walker.nextNode())) {
        const expression = /\S+/g;
        let match;
        while ((match = expression.exec(textNode.nodeValue))) {
          words.push({ node: textNode, start: match.index, end: expression.lastIndex });
        }
      }

      if (!words.length) return [block];

      const createSegment = (start, end, includeLeadingSpace) => {
        const range = document.createRange();
        range.setStart(words[start].node, words[start].start);
        range.setEnd(words[end - 1].node, words[end - 1].end);
        const segment = block.cloneNode(false);
        if (includeLeadingSpace) segment.appendChild(document.createTextNode(' '));
        segment.appendChild(range.cloneContents());
        return segment;
      };

      const segments = [];
      let start = 0;
      while (start < words.length) {
        let low = start + 1;
        let high = words.length;
        let best = start + 1;

        while (low <= high) {
          const middle = Math.floor((low + high) / 2);
          const candidate = createSegment(start, middle, start > 0);
          if (fitsPage(root, [candidate], measurement)) {
            best = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }

        segments.push(createSegment(start, best, start > 0));
        start = best;
      }
      return segments;
    }

    function paginateContentPage(page, measurement) {
      const template = document.createElement('template');
      template.innerHTML = page.html.trim();
      const root = template.content.firstElementChild;
      if (!root) return [{ ...page, sourcePartIndex: 0 }];

      const blocks = Array.from(root.children).map(block => block.cloneNode(true));
      const pages = [];
      let currentBlocks = [];

      const saveCurrentPage = () => {
        if (!currentBlocks.length) return;
        pages.push({
          ...page,
          html: pageHtml(root, currentBlocks),
          sourcePartIndex: pages.length
        });
        currentBlocks = [];
      };

      blocks.forEach(block => {
        if (fitsPage(root, [...currentBlocks, block], measurement)) {
          currentBlocks.push(block);
          return;
        }

        saveCurrentPage();
        if (fitsPage(root, [block], measurement)) {
          currentBlocks = [block];
          return;
        }

        const segments = block.tagName === 'P'
          ? splitTextBlock(block, root, measurement)
          : [block];
        segments.forEach((segment, index) => {
          if (currentBlocks.length && !fitsPage(root, [...currentBlocks, segment], measurement)) {
            saveCurrentPage();
          }
          currentBlocks.push(segment);
          if (index < segments.length - 1) saveCurrentPage();
        });
      });

      saveCurrentPage();
      return pages.length ? pages : [{ ...page, sourcePartIndex: 0 }];
    }

    function paginateTocPage(page, measurement) {
      const template = document.createElement('template');
      template.innerHTML = page.html.trim();
      const root = template.content.firstElementChild;
      const list = root?.querySelector('div.space-y-1');
      if (!root || !list) return [{ ...page, sourcePartIndex: 0 }];

      const buttons = Array.from(list.querySelectorAll('button'));
      const pages = [];
      let currentButtons = [];

      const createPageRoot = pageButtons => {
        const pageRoot = root.cloneNode(true);
        const pageList = pageRoot.querySelector('.space-y-1');
        pageList.innerHTML = '';
        pageButtons.forEach(button => pageList.appendChild(button.cloneNode(true)));
        if (pages.length > 0) {
          const heading = pageRoot.querySelector('h2');
          if (heading) heading.textContent = 'SUMÁRIO (CONTINUAÇÃO)';
        }
        return pageRoot;
      };

      const saveTocPage = () => {
        if (!currentButtons.length) return;
        const pageRoot = createPageRoot(currentButtons);
        pages.push({
          ...page,
          html: pageRoot.outerHTML,
          sourcePartIndex: pages.length
        });
        currentButtons = [];
      };

      buttons.forEach(button => {
        const candidate = [...currentButtons, button];
        const candidateRoot = createPageRoot(candidate);
        if (fitsPage(candidateRoot, Array.from(candidateRoot.children), measurement)) {
          currentButtons = candidate;
        } else if (currentButtons.length) {
          saveTocPage();
          currentButtons = [button];
        } else {
          currentButtons = [button];
          saveTocPage();
        }
      });
      saveTocPage();
      return pages.length ? pages : [{ ...page, sourcePartIndex: 0 }];
    }

    function updateStaticTOC() {
      const chapters = [];
      sourcePages.forEach((page, sourcePageIndex) => {
        if (!page.chapter || page.chapter === 'Introdução') return;
        if (!chapters.some(chapter => chapter.title === page.chapter)) {
          chapters.push({ title: page.chapter, sourcePageIndex });
        }
      });

      const tocPages = rawPages.filter(page => page.type === 'toc');
      let chapterIndex = 0;
      tocPages.forEach(page => {
        const container = document.createElement('div');
        container.innerHTML = page.html;
        const buttons = container.querySelectorAll('button');
        buttons.forEach(button => {
          const chapter = chapters[chapterIndex];
          chapterIndex += 1;
          if (!chapter) return;
          const pageIndex = rawPages.findIndex(item => item.sourcePageIndex === chapter.sourcePageIndex);
          if (pageIndex < 0) return;
          button.setAttribute('onclick', `jumpToPage(${pageIndex + 1})`);
          const pageLabel = button.querySelector('span:last-child');
          if (pageLabel) pageLabel.textContent = `Pág. ${pageIndex + 1}`;
        });
        page.html = container.innerHTML;
      });
    }

    function rebuildPages(preservePosition) {
      if (isRepaginating) return;
      isRepaginating = true;
      const currentPage = rawPages[currentPageIndex];
      const sourcePageIndex = preservePosition ? currentPage?.sourcePageIndex : 0;
      const sourcePartIndex = preservePosition ? currentPage?.sourcePartIndex || 0 : 0;
      const paginatedPages = [];
      let measurement;

      try {
        measurement = createMeasurementPage();
        sourcePages.forEach(page => {
          let result;
          if (page.type === 'content') {
            result = paginateContentPage(page, measurement);
          } else if (page.type === 'toc') {
            result = paginateTocPage(page, measurement);
          } else {
            result = [{ ...page, sourcePartIndex: 0 }];
          }
          paginatedPages.push(...result);
        });

        measurement.dispose();
        rawPages.splice(0, rawPages.length, ...paginatedPages);
        updateStaticTOC();
        organizeSpreads();
        buildTOC();

        let preservedIndex = rawPages.findIndex(page =>
          page.sourcePageIndex === sourcePageIndex && page.sourcePartIndex === sourcePartIndex
        );
        if (preservedIndex < 0 && sourcePageIndex !== undefined) {
          preservedIndex = rawPages.findIndex(page => page.sourcePageIndex === sourcePageIndex);
        }
        currentPageIndex = preservedIndex >= 0 ? preservedIndex : 0;
        if (!isMobileLayout()) currentPageIndex = Math.floor(currentPageIndex / 2) * 2;

        if (document.getElementById('left-page-container').innerHTML) {
          renderSpread();
        }
      } finally {
        measurement?.dispose();
        isRepaginating = false;
      }
    }

    /* Renderização do Livro Aberto */
    function renderSpread() {
      currentSpreadIndex = Math.floor(currentPageIndex / 2);
      const spread = spreads[currentSpreadIndex];
      const leftContainer = document.getElementById('left-page-container');
      const rightContainer = document.getElementById('right-page-container');
      const bookContainer = document.getElementById('open-book-container');
      const mobileLayout = isMobileLayout();

      // Animação de virada
      bookContainer.classList.remove('page-turn-anim-next', 'page-turn-anim-prev');
      void bookContainer.offsetWidth; // trigger reflow
      bookContainer.classList.add('page-turn-anim-next');

      // Conteúdo da Página Esquerda
      if (spread.leftPage) {
        leftContainer.innerHTML = `
          <div class="flex-1 page-body-content">${spread.leftPage.html}</div>
          <div class="page-footer mt-4 pt-2 border-t border-gray-200/60 flex justify-between items-center text-[11px] text-gray-400 font-sans">
            <span class="font-medium text-gray-500">VOZES DA PSICOLOGIA</span>
            <span class="font-bold text-gray-600">Pág. ${spread.leftIndex + 1}</span>
          </div>
        `;
        leftContainer.classList.toggle('active-mobile', mobileLayout && currentPageIndex === spread.leftIndex);
        applyFontSize(leftContainer);
      } else {
        leftContainer.innerHTML = '';
        leftContainer.classList.remove('active-mobile');
      }

      // Conteúdo da Página Direita
      if (spread.rightPage) {
        rightContainer.innerHTML = `
          <div class="flex-1 page-body-content">${spread.rightPage.html}</div>
          <div class="page-footer mt-4 pt-2 border-t border-gray-200/60 flex justify-between items-center text-[11px] text-gray-400 font-sans">
            <span class="font-medium text-gray-500">VOZES DA PSICOLOGIA</span>
            <span class="font-bold text-gray-600">Pág. ${spread.rightIndex + 1}</span>
          </div>
        `;
        rightContainer.classList.toggle('active-mobile', mobileLayout && currentPageIndex === spread.rightIndex);
        applyFontSize(rightContainer);
      } else {
        rightContainer.innerHTML = `
          <div class="h-full flex items-center justify-center text-gray-300 font-serif italic text-sm">
            [ Fim da Antologia ]
          </div>
        `;
        rightContainer.classList.remove('active-mobile');
      }

      updateUI();

      if (isSpeaking) {
        stopTTS();
      }
    }

    /* Som de folhear papel usando Web Audio API */
    function playPaperTurnSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        
        const bufferSize = ctx.sampleRate * 0.12;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.1);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    /* Navegação entre Espalhamentos */
    function nextSpread() {
      const pageStep = isMobileLayout() ? 1 : 2;
      if (currentPageIndex + pageStep < rawPages.length) {
        currentPageIndex += pageStep;
        playPaperTurnSound();
        renderSpread();
      }
    }

    function prevSpread() {
      const pageStep = isMobileLayout() ? 1 : 2;
      if (currentPageIndex > 0) {
        currentPageIndex = Math.max(0, currentPageIndex - pageStep);
        playPaperTurnSound();
        renderSpread();
      }
    }

    function jumpToSpread(num) {
      const idx = parseInt(num) - 1;
      const maxIndex = isMobileLayout() ? rawPages.length - 1 : spreads.length - 1;
      if (idx >= 0 && idx <= maxIndex) {
        currentPageIndex = isMobileLayout() ? idx : idx * 2;
        playPaperTurnSound();
        renderSpread();
      }
    }

    function jumpToPage(pageNumber) {
      const pageIdx = pageNumber - 1;
      if (pageIdx >= 0 && pageIdx < rawPages.length) {
        currentPageIndex = isMobileLayout() ? pageIdx : Math.floor(pageIdx / 2) * 2;
        playPaperTurnSound();
        renderSpread();
      }
    }

    function updateUI() {
      const spread = spreads[currentSpreadIndex];
      const pageLeftNum = spread.leftIndex + 1;
      const pageRightNum = spread.rightIndex ? spread.rightIndex + 1 : pageLeftNum;
      const mobileLayout = isMobileLayout();

      document.getElementById('open-pages-label').innerText = mobileLayout
        ? `${currentPageIndex + 1}`
        : `${pageLeftNum} - ${pageRightNum}`;
      document.getElementById('pages-label').innerText = mobileLayout ? 'Página' : 'Páginas';
      document.getElementById('total-pages-label').innerText = `de ${rawPages.length}`;
      document.getElementById('spread-slider').max = mobileLayout ? rawPages.length : spreads.length;
      document.getElementById('spread-slider').value = mobileLayout ? currentPageIndex + 1 : currentSpreadIndex + 1;

      // Atualiza o título no rodapé
      const currentPage = mobileLayout ? rawPages[currentPageIndex] : spread.leftPage;
      const title = currentPage.chapter || currentPage.title;
      document.getElementById('current-spread-title').innerText = title;
    }

    /* Sumário Lateral */
    function buildTOC() {
      const tocList = document.getElementById('toc-list');
      tocList.innerHTML = '';

      rawPages.forEach((page, idx) => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left p-2.5 rounded-lg hover:bg-gray-800 transition flex justify-between items-center text-gray-200 hover:text-amber-300 border-b border-gray-800/60';
        
        const titleText = page.chapter ? `${page.chapter}` : page.title;
        const authorText = page.author ? `<span class="block text-[11px] text-gray-400 font-normal mt-0.5">${page.author}</span>` : '';

        btn.innerHTML = `
          <div>
            <span class="font-medium text-xs sm:text-sm text-amber-100">${idx + 1}. ${titleText}</span>
            ${authorText}
          </div>
          <span class="text-[11px] bg-gray-900 border border-gray-700 px-2 py-0.5 rounded text-amber-400 font-bold">Pág. ${idx + 1}</span>
        `;
        
        btn.onclick = () => {
          jumpToPage(idx + 1);
          toggleTOC();
        };

        tocList.appendChild(btn);
      });
    }

    function toggleTOC() {
      const sidebar = document.getElementById('sidebar-toc');
      const overlay = document.getElementById('toc-overlay');
      const isClosed = sidebar.classList.contains('-translate-x-full');
      if (isClosed) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    /* ==========================================================================
       3. REPRODUTOR DE VOZ (TEXT-TO-SPEECH) SEQUENCIAL DAS DUAS PÁGINAS ABERTAS
       ========================================================================== */
    function toggleTTS() {
      if (isSpeaking) {
        if (synth.paused) {
          synth.resume();
          updateTTSStatus("Lendo...");
          togglePlayIcons(true);
        } else {
          synth.pause();
          updateTTSStatus("Pausado");
          togglePlayIcons(false);
        }
      } else {
        startTTSForOpenBook();
      }
    }

    function startTTSForOpenBook() {
      if (!('speechSynthesis' in window)) {
        alert("Navegador sem suporte para síntese de voz.");
        return;
      }

      synth.cancel();

      const mobileLayout = isMobileLayout();
      const currentPageContainer = currentPageIndex % 2 === 0
        ? document.getElementById('left-page-container')
        : document.getElementById('right-page-container');
      const leftText = document.getElementById('left-page-container').innerText || '';
      const rightText = document.getElementById('right-page-container').innerText || '';
      const fullSpreadText = mobileLayout
        ? currentPageContainer.innerText || ''
        : `${leftText}. ${rightText}`;

      if (!fullSpreadText.trim()) return;

      const utterance = new SpeechSynthesisUtterance(fullSpreadText);
      utterance.lang = 'pt-BR';
      utterance.rate = ttsSpeed;

      const voices = synth.getVoices();
      const ptVoice = voices.find(v => v.lang.includes('pt') || v.lang.includes('BR'));
      if (ptVoice) utterance.voice = ptVoice;

      utterance.onstart = function() {
        isSpeaking = true;
        togglePlayIcons(true);
        updateTTSStatus(mobileLayout ? "Lendo página aberta..." : "Lendo páginas abertas...");
      };

      utterance.onend = function() {
        isSpeaking = false;
        togglePlayIcons(false);
        updateTTSStatus("Leitura Concluída");
      };

      utterance.onerror = function() {
        isSpeaking = false;
        togglePlayIcons(false);
        updateTTSStatus("Erro no áudio");
      };

      synth.speak(utterance);
    }

    function stopTTS() {
      if (synth) synth.cancel();
      isSpeaking = false;
      togglePlayIcons(false);
      updateTTSStatus("Ouvir Páginas");
    }

    function updateTTSSpeed(val) {
      ttsSpeed = parseFloat(val);
      if (isSpeaking) {
        stopTTS();
        startTTSForOpenBook();
      }
    }

    function togglePlayIcons(isPlaying) {
      const play = document.getElementById('icon-play');
      const pause = document.getElementById('icon-pause');
      if (isPlaying) {
        play.classList.add('hidden');
        pause.classList.remove('hidden');
      } else {
        play.classList.remove('hidden');
        pause.classList.add('hidden');
      }
    }

    function updateTTSStatus(msg) {
      document.getElementById('tts-status').innerText = msg;
    }

    /* Acessibilidade & Eventos */
    function toggleHighContrast() {
      isHighContrast = !isHighContrast;
      document.getElementById('app-body').classList.toggle('high-contrast', isHighContrast);
      rebuildPages(true);
    }

    function changeFontSize(delta) {
      currentFontSizeOffset += delta;
      if (currentFontSizeOffset < -2) currentFontSizeOffset = -2;
      if (currentFontSizeOffset > 3) currentFontSizeOffset = 3;

      rebuildPages(true);
    }

    function applyFontSize(pageContainer) {
      if (currentFontSizeOffset === 0) return;
      const pageBody = pageContainer.querySelector('.page-body-content');
      if (pageBody) pageBody.style.fontSize = `${0.9 + (currentFontSizeOffset * 0.07)}rem`;
    }

    function setupEvents() {
      let resizeTimeout;
      window.addEventListener('resize', () => {
        window.clearTimeout(resizeTimeout);
        resizeTimeout = window.setTimeout(() => rebuildPages(true), 150);
      });

      document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;
        if (e.key === 'ArrowRight') nextSpread();
        if (e.key === 'ArrowLeft') prevSpread();
        if (e.key === ' ') { e.preventDefault(); toggleTTS(); }
        if (e.key === 'Escape') stopTTS();
      });

      // Gestos de toque
      let touchStartX = 0;
      const bookEl = document.getElementById('book-content');
      bookEl.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
      bookEl.addEventListener('touchend', (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (diff < -50) nextSpread();
        if (diff > 50) prevSpread();
      }, { passive: true });
    }

  </script>
</body>
</html>
